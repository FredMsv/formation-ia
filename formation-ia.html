<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Formation IA · Socle IA</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { corePlugins: { preflight: false } };</script>
<style>
/* Layout : colonne de 1080px sous un bandeau blanc ; cartes grises plates, bandeaux orange et encadrés pêche repris du support de formation */
:root{
  --orange:#EA6827; --orange-2:#ED7D31; --orange-deep:#C4501A; --peach:#FDEEE3; --peach-2:#FBE3D2;
  --card:#F3F3F3; --ink:#333333; --ink-2:#404040; --muted:#666666; --line:#E2E2E2; --white:#FFFFFF;
  --ok:#2C7A4B; --ok-soft:#E3F2E8; --bad:#B3261E; --bad-soft:#FBE5E3;
  --console:#2F2F2F; --console-ink:#EDEDED; --console-dim:#A8A8A8;
  --c-thought:#FFB98A; --c-action:#FFD66B; --c-obs:#A9D1FF; --c-ok:#8FE0B0; --c-err:#FF9C92; --c-warn:#FFCB7A;
  --f:"Calibri","Carlito","Segoe UI",Candara,"Helvetica Neue",Arial,sans-serif;
  --mono:"Consolas","Cascadia Mono","SFMono-Regular",Menlo,"Courier New",monospace;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--white);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p,ul,ol,figure{margin:0}
ul,ol{padding:0;list-style:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
:focus-visible{outline:2px solid var(--orange-deep);outline-offset:2px;border-radius:4px}
[tabindex="-1"]:focus{outline:none}
.wrap{max-width:1080px;margin-inline:auto;padding-inline:16px}
@media (min-width:640px){.wrap{padding-inline:28px}}
main.wrap{padding-block:8px 72px}

/* Typographie (Calibri, comme le support) */
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--orange-deep);font-weight:700}
.eyebrow.grey{color:var(--muted)}
.title{font-size:clamp(26px,3.6vw,34px);font-weight:400;line-height:1.18;color:var(--ink);text-wrap:balance;letter-spacing:-.005em}
.h2{font-size:22px;font-weight:400;line-height:1.25;text-wrap:balance}
.h3{font-size:17px;font-weight:700;line-height:1.35}
.lead{font-size:17px;color:var(--ink-2);max-width:68ch}
.muted{color:var(--muted)}
.small{font-size:14px}
.xs{font-size:12.5px}
.mono{font-family:var(--mono)}
.num{font-variant-numeric:tabular-nums}
.prose{max-width:70ch}

/* Bandeau supérieur */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--white);border-bottom:1px solid var(--line)}
.topbar-in{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:12px}
@media (max-width:1320px){.player>span:first-child{display:none}}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.brand b{display:block;font-size:15px;line-height:1.15}
.brand small{display:block;font-size:12px;color:var(--muted)}
.gp{flex:1 1 240px;min-width:0}
.gp-top{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--muted);margin-bottom:5px}
.gp-top strong{color:var(--ink)}
.gp-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.seg{height:8px;border-radius:99px;background:var(--card);overflow:hidden;display:block}
.seg i{display:block;height:100%;width:0;background:var(--orange-2);border-radius:inherit;transition:width .6s ease}
.seg.ok i{background:var(--ok)}
.player{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-2)}
.btn-top{border:1px solid var(--line);padding:6px 12px;border-radius:6px;font-size:13.5px;color:var(--ink-2);background:var(--white)}
.btn-top:hover{border-color:var(--orange)}

/* Surfaces reprises du support */
.card{background:var(--card);border-radius:6px;padding:18px 20px}
.panel{background:var(--white);border:1px solid var(--line);border-radius:8px;padding:20px}
@media (min-width:640px){.panel{padding:26px}}
.banner{background:var(--orange);color:#fff;border-radius:6px;padding:14px 18px;font-size:16.5px}
.banner b{font-weight:700}
.callout{background:var(--peach);border-radius:6px;padding:14px 18px}
.callout .eyebrow{display:block;margin-bottom:4px}
.divider{height:1px;background:var(--line);border:0;margin:0}
.num-circle{width:34px;height:34px;border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center;font-weight:700;flex:none;font-variant-numeric:tabular-nums}
.num-circle.sm{width:26px;height:26px;font-size:13px}
.num-circle.off{background:var(--line);color:var(--muted)}
.num-circle.ok{background:var(--ok)}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:6px;padding:10px 18px;font-weight:700;font-size:15px;border:1px solid transparent;line-height:1.3;transition:background .15s,border-color .15s,transform .1s}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn-primary{background:var(--orange-deep);color:#fff}
.btn-primary:hover:not(:disabled){background:#A9440F}
.btn-ok{background:var(--ok);color:#fff}
.btn-ok:hover:not(:disabled){background:#21603A}
.btn-ghost{background:var(--white);border-color:#CFCFCF;color:var(--ink)}
.btn-ghost:hover:not(:disabled){border-color:var(--orange)}
.btn-danger{background:var(--bad);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{color:var(--orange-deep);font-weight:700;font-size:14.5px}
.link:hover{text-decoration:underline}

/* Pastilles */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--card);color:var(--ink-2);line-height:1.5}
.pill-o{background:var(--peach-2);color:var(--orange-deep)}
.pill-ok{background:var(--ok-soft);color:var(--ok)}
.pill-bad{background:var(--bad-soft);color:var(--bad)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}

/* Jauges */
.bar{height:8px;background:var(--card);border-radius:99px;overflow:hidden}
.bar>span{display:block;height:100%;background:var(--orange-2);border-radius:inherit;transition:width .6s ease}
.bar.ok>span{background:var(--ok)}
.gauge{position:relative;height:14px;background:var(--card);border-radius:99px;margin-top:28px}
.gauge-fill{height:100%;border-radius:inherit;background:var(--bad);transition:width .9s cubic-bezier(.2,.8,.2,1)}
.gauge-fill.ok{background:var(--ok)}
.gauge-mark{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--ink)}
.gauge-mark span{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:11.5px;font-weight:700;color:var(--muted);white-space:nowrap;padding-bottom:2px}
.score-big{font-weight:700;font-size:54px;line-height:1;font-variant-numeric:tabular-nums}

/* Options de réponse */
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--white);border:1px solid #D6D6D6;border-radius:6px;padding:12px 14px;transition:border-color .15s,background .15s;line-height:1.5}
.opt:hover:not(:disabled){border-color:var(--orange)}
.opt:disabled{cursor:default}
.opt.sel,.opt[aria-pressed="true"]{border-color:var(--orange);background:var(--peach);box-shadow:inset 0 0 0 1px var(--orange)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft);box-shadow:inset 0 0 0 1px var(--ok)}
.opt.ok-reveal{border-color:var(--ok);border-style:dashed}
.opt.bad{border-color:var(--bad);background:var(--bad-soft);box-shadow:inset 0 0 0 1px var(--bad)}
.opt.fade{opacity:.6}
.key{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--card);color:var(--ink-2)}
.opt.sel .key,.opt[aria-pressed="true"] .key{background:var(--orange);color:#fff}
.opt.ok .key{background:var(--ok);color:#fff}
.opt.bad .key{background:var(--bad);color:#fff}
.check{flex:none;width:20px;height:20px;border-radius:4px;border:1.5px solid #8A8A8A;display:grid;place-items:center;margin-top:2px;font-size:13px;line-height:1;background:var(--white)}
.opt[aria-pressed="true"] .check{background:var(--orange);border-color:var(--orange);color:#fff}
.opt-body{min-width:0;flex:1}
.opt-fb{margin-top:8px;font-size:14.5px;color:var(--ink)}

/* Feedback */
.fb{border-radius:6px;padding:14px 18px;background:var(--card)}
.fb-ok{background:var(--ok-soft)}
.fb-bad{background:var(--bad-soft)}
.fb-head{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:4px}
.fb-ok .fb-head{color:var(--ok)}
.fb-bad .fb-head{color:var(--bad)}

/* Zones de code */
.prompt-box{background:var(--card);border-radius:6px;padding:14px 16px;font-family:var(--mono);font-size:13.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word;color:var(--ink)}
.prompt-box .pk{color:var(--orange-deep);font-weight:700}
.prompt-box .pe{color:var(--muted);font-style:italic}
.console{background:var(--console);color:var(--console-ink);border-radius:6px;padding:14px 16px;font-family:var(--mono);font-size:13px;line-height:1.55;max-height:470px;min-height:140px;overflow:auto}
.ln{display:grid;grid-template-columns:120px minmax(0,1fr);gap:10px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.07);animation:lnIn .25s ease both}
.ln:last-child{border-bottom:0}
.ln .lt{font-weight:700;white-space:nowrap}
.ln-thought .lt{color:var(--c-thought)} .ln-action .lt{color:var(--c-action)} .ln-obs .lt{color:var(--c-obs)}
.ln-ok .lt,.ln-final .lt{color:var(--c-ok)} .ln-err .lt{color:var(--c-err)} .ln-warn .lt{color:var(--c-warn)} .ln-info .lt{color:var(--console-dim)}
.ln-err .lx{color:var(--c-err)} .ln-final .lx{color:var(--c-ok)} .ln-action .lx{color:#FFF0C7}
.ln .it{color:var(--console-dim);font-weight:400}
.ln-idle{color:var(--console-dim)}
@keyframes lnIn{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
@media (max-width:540px){.ln{grid-template-columns:minmax(0,1fr);gap:0}}

/* Feutre noir (N2) */
.redact-text{background:var(--card);border-radius:6px;padding:18px 20px;line-height:2.25;font-size:16px}
.rs{display:inline;border-radius:4px;padding:3px 6px;border:1.5px dashed #9A9A9A;background:var(--white);cursor:pointer;line-height:1.4;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.rs:hover:not(:disabled){border-color:var(--orange)}
.rs.on{background:#1F1F1F;color:#fff;border-style:solid;border-color:#1F1F1F}
.rs.good{outline:2px solid var(--ok);outline-offset:1px}
.rs.wrong{outline:2px solid var(--bad);outline-offset:1px}
.rs:disabled{cursor:default}

/* Pipeline (N3) */
.pipe{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.chip{font-size:13px;font-weight:700;padding:5px 10px;border-radius:6px;background:var(--card);color:var(--muted);border:1px solid transparent;transition:all .2s}
.chip.on{background:var(--peach);color:var(--orange-deep);border-color:var(--orange)}
.chip.done{background:var(--ok-soft);color:var(--ok)}
.chip.fail{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.arrow{color:var(--muted);font-size:12px}
.order-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:6px;background:var(--card);border:1px solid transparent;transition:box-shadow .15s,background .15s}
.order-row.draggable{cursor:grab;user-select:none;-webkit-user-select:none}
.order-row.draggable:hover{border-color:#D6D6D6}
.order-row.dragging{cursor:grabbing;background:var(--peach);border-color:var(--orange);box-shadow:0 10px 24px rgba(0,0,0,.15);position:relative;z-index:2}
.grip{flex:none;width:30px;height:40px;display:grid;place-items:center;color:var(--muted);font-size:18px;letter-spacing:-3px;touch-action:none;border-radius:6px}
.order-row.draggable:hover .grip{color:var(--orange-deep)}
.order-row .num-circle{background:var(--white);color:var(--ink);border:1px solid var(--line)}
.order-row.good .num-circle{background:var(--ok);color:#fff;border-color:var(--ok)}
.order-row.wrong .num-circle{background:var(--bad);color:#fff;border-color:var(--bad)}
.mv{width:34px;height:34px;border-radius:6px;border:1px solid #CFCFCF;display:grid;place-items:center;color:var(--ink-2);font-size:15px;background:var(--white)}
.mv:hover:not(:disabled){border-color:var(--orange);color:var(--orange-deep)}
.mv:disabled{opacity:.3;cursor:not-allowed}

/* Outils (N4) */
.tool{display:flex;flex-direction:column;gap:4px;text-align:left;border:1px solid #D6D6D6;border-radius:6px;padding:12px 14px;background:var(--white);min-width:0;transition:border-color .15s,background .15s}
.tool:hover:not(:disabled){border-color:var(--orange)}
.tool[aria-pressed="true"]{border-color:var(--orange);background:var(--peach);box-shadow:inset 0 0 0 1px var(--orange)}
.tool code{font-family:var(--mono);font-size:12.5px;color:var(--muted);word-break:break-all}
.tool .tname{font-weight:700;font-size:15px;display:flex;justify-content:space-between;gap:8px}
.sw{flex:none;width:32px;height:19px;border-radius:99px;background:var(--line);position:relative}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:var(--white);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .15s}
.tool[aria-pressed="true"] .sw{background:var(--orange)}
.tool[aria-pressed="true"] .sw::after{left:15px}
.segd{display:flex;flex-wrap:wrap;gap:6px}
.segd button{font-size:13.5px;font-weight:700;padding:6px 10px;border-radius:6px;border:1px solid #CFCFCF;background:var(--white)}
.segd button[aria-pressed="true"]{background:var(--orange);border-color:var(--orange);color:#fff}
.segd button.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.segd button.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.segd button.ok-reveal{border:2px dashed var(--ok)}
.review{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;padding:9px 0;border-bottom:1px solid var(--line)}
.review:last-child{border-bottom:0}
.mark{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;margin-top:1px;color:#fff}
.mark.y{background:var(--ok)} .mark.n{background:var(--bad)}

/* Quiz */
.qdots{display:flex;gap:4px;flex-wrap:wrap}
.qdot{width:22px;height:6px;border-radius:99px;background:var(--line)}
.qdot.cur{background:var(--orange)} .qdot.y{background:var(--ok)} .qdot.n{background:var(--bad)}

/* Personnages */
.person{display:flex;align-items:center;gap:12px}
.person svg{flex:none;border-radius:50%}
.person b{display:block;font-size:15px;line-height:1.2}
.person span{display:block;font-size:13px;color:var(--muted)}

/* Niveaux (accueil) */
.lvl{display:flex;flex-direction:column;gap:14px;background:var(--white);border:1px solid var(--line);border-radius:8px;padding:22px;min-width:0}
.lvl.locked{background:var(--card);border-color:transparent}
.lvl.locked .lvl-title{color:var(--muted)}
.lvl-title{font-size:21px;line-height:1.2;text-wrap:balance}
.tagrow{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12.5px;padding:2px 9px;border-radius:99px;background:var(--card);color:var(--ink-2)}
.lvl.locked .tag{background:var(--white)}

/* Résumé de cours */
.sum-grid{display:grid;gap:14px}
@media (min-width:720px){.sum-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1000px){.sum-grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}}
.sum-card{background:var(--card);border-radius:6px;padding:18px 20px;display:flex;gap:14px;align-items:flex-start;min-width:0}
.sum-card h3{font-size:16.5px;font-weight:700;line-height:1.3}
.sum-card p{font-size:14.5px;margin-top:4px;color:var(--ink-2)}
.sum-card .src{display:block;margin-top:8px;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--orange-deep);font-weight:700}

/* Code de passage & certificat */
.code-box{background:var(--peach);border:2px dashed var(--orange);border-radius:8px;padding:20px;text-align:center}
.code-val{font-family:var(--mono);font-size:clamp(26px,5vw,38px);font-weight:700;letter-spacing:.08em;color:var(--orange-deep);word-break:break-all}
.cert{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:28px 22px;position:relative;overflow:hidden}
@media (min-width:640px){.cert{padding:44px 48px}}
.cert::before{content:"";position:absolute;inset:10px;border:1.5px solid var(--peach-2);border-radius:6px;pointer-events:none}
.cert-title{font-size:clamp(30px,5vw,44px);line-height:1.05;color:var(--orange-deep);font-weight:700}
.seal{width:116px;height:116px;border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center;text-align:center;flex:none;box-shadow:0 0 0 6px var(--peach),0 0 0 8px var(--orange-2)}
.seal b{font-size:36px;line-height:1;display:block;font-variant-numeric:tabular-nums}
.seal span{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase}
.cert-skill{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 16px;padding:10px 0;border-top:1px solid var(--line)}
.cert-skill em{font-style:normal;font-variant-numeric:tabular-nums;color:var(--ok);font-weight:700}
.cert-skill small{grid-column:1/-1;color:var(--muted);font-size:13.5px}

/* Formulaires */
.field{width:100%;border:1px solid #CFCFCF;border-radius:6px;padding:10px 12px;background:var(--white);color:var(--ink)}
.field:focus{outline:2px solid var(--orange);outline-offset:0;border-color:transparent}
.field.err{border-color:var(--bad);background:var(--bad-soft)}
label.lbl{display:block;font-weight:700;font-size:14.5px;margin-bottom:6px}
textarea.field{font-family:var(--mono);font-size:13px;min-height:190px;resize:vertical}
.form-err{color:var(--bad);font-weight:700;font-size:14.5px}

/* Fenêtre et notifications */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(30,30,30,.5);display:grid;place-items:center;padding:16px}
.modal{background:var(--white);border-radius:10px;padding:24px;max-width:450px;width:100%;box-shadow:0 24px 60px rgba(0,0,0,.25)}
.toast{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:#fff;border-radius:8px;padding:12px 16px;display:flex;gap:12px;align-items:center;max-width:min(380px,calc(100vw - 32px));box-shadow:0 14px 40px rgba(0,0,0,.25);animation:toastIn .3s ease both}
.toast small{color:#D0D0D0;display:block;font-size:13px}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.sticky-col{position:sticky;top:calc(env(safe-area-inset-top,0px) + 96px)}
@media (max-width:1023px){.sticky-col{position:static}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* Question de satisfaction */
.sat-scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.sat-btn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border:1px solid #CFCFCF;border-radius:8px;background:var(--white);cursor:pointer;min-height:64px}
.sat-btn b{font-size:22px;line-height:1}
.sat-btn small{font-size:11px;color:#666;text-align:center;line-height:1.2}
.sat-btn:hover{border-color:var(--orange)}
.sat-btn.on{background:var(--orange-deep);border-color:var(--orange-deep);color:#fff}
.sat-btn.on small{color:#fff}
textarea.field.sat-comment{font-family:inherit;font-size:14px;min-height:72px}
@media (max-width:520px){.sat-btn small{display:none}}

/* Vrai ou faux éclair */
.tf-card{border:2px solid var(--orange);border-radius:12px;background:var(--peach);padding:28px 24px;min-height:120px;display:flex;align-items:center;justify-content:center;text-align:center;transition:background .2s,border-color .2s}
.tf-card p{font-size:21px;line-height:1.45;font-weight:600;margin:0;max-width:720px}
.tf-card.is-ok{border-color:var(--ok);background:var(--ok-soft)}
.tf-card.is-bad{border-color:var(--bad);background:var(--bad-soft)}
.tf-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}

<script>
/* =====================================================================

const WEBHOOK_URL = "https://hook.eu2.make.com/nfuswd0gqqz4kv7vrs2lid42tnilpf4v";

// Identifiant de la petite Google Sheet « Config Formation IA » (groupe actif en Config!A2).
const CONFIG_SHEET_ID = "1-v3PQq4ukj73AeewDwqHIKomZx3ESaBKMBarJJq83nc";

// Seuil de validation de chaque niveau, en pourcentage.
const SEUIL = 85;

// Seules les adresses de ce domaine peuvent jouer. Mettez "" pour accepter toute adresse (tests externes).

// Sel des clés de reprise (NIV2-XXXX…) et du code de certificat. Changez-le avant diffusion.
const CODE_SECRET = "Lendys_AI2026";

// Code formateur : ouvre les quatre niveaux (tests, support). À garder confidentiel.
const CODE_FORMATEUR = "Lendys_FormateurAI2026";

const STORAGE_KEY = "formation-ia-parcours-unique";
const VERSION_LABEL = "Parcours unique · v2026-10-07.u1";

/* =====================================================================
   NOYAU COMMUN : outils, état, suivi webhook, personnages, composants
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const shuffle = a => { const b = [...a]; for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
const reduceMotion = () => !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

/* ---------- Métadonnées des niveaux ---------- */
const LEVEL_META = {
  1: { title: 'Démystifier l’IA générative', short: 'Fondations', mins: 9, src: 'Bloc 1, séquences 01 à 04',
       format: 'Vrai ou faux, situations, curseur de température, tri express, détecteur d’hallucination',
       intro: 'Un LLM ne « sait » pas : il prédit le mot suivant. Familles de l’IA, tokens, température, frontière irrégulière, hallucinations : de quoi savoir quand faire confiance et quand vérifier.',
       tags: ['Familles de l’IA', 'Tokens', 'Température', 'Frontière irrégulière', 'Hallucinations', 'Niveau de contrôle'] },
  2: { title: 'Prompt et données', short: 'L’artisan', mins: 10, src: 'Bloc 1, séquences 06 à 08',
       format: 'Vrai ou faux, tri des données, atelier « Répare le prompt » (diagnostic, feutre noir, recette CADRE)',
       intro: 'Le fil rouge : la réponse à M. Laurent, sociétaire furieux après un refus d’indemnisation. Classez les données, diagnostiquez le prompt, passez le feutre noir, puis reconstruisez-le avec la méthode CADRE.',
       tags: ['Méthode CADRE', 'Cinq ingrédients', 'Niveaux de données', 'Feutre noir', 'RGPD'] },
  3: { title: 'RAG et contexte', short: 'L’architecte de données', mins: 9, src: 'Bloc 1, séquences 08 et 10',
       format: 'Vrai ou faux, « sourcée mais fausse ? », atelier pipeline RAG et simulation',
       intro: 'Construisez l’assistant documentaire qui répond « à livre ouvert », sans tomber dans le grenier poussiéreux ni laisser les portes mal fermées.',
       tags: ['Livre ouvert', 'Découpage', 'Recherche par le sens', 'Grenier poussiéreux', 'Droits d’accès'] },
  4: { title: 'Agents et cadre réglementaire', short: 'Le concepteur', mins: 10, src: 'Bloc 1, séquences 07 à 09',
       format: 'Vrai ou faux, frise de l’AI Act, atelier agent (outils, garde-fous, AI Act, simulation), boss final',
       intro: 'Équipez un agent de traitement des réclamations au moindre privilège, bornez sa boucle, classez des usages selon l’AI Act, puis affrontez le boss final : le kit de survie.',
       tags: ['Assistant ou agent', 'Moindre privilège', 'Zones rouges', 'AI Act', 'Kit de survie'] },
};
const SKILLS = {
  1: 'Distinguer les familles de l’IA, expliquer comment un LLM produit une réponse, repérer une réponse à vérifier et adapter le contrôle à l’enjeu',
  2: 'Écrire un prompt métier selon la méthode CADRE, à partir de données classées et passées au feutre noir',
  3: 'Concevoir un assistant RAG fiable : sources datées, droits d’accès appliqués avant la génération, réponses sourcées et vérifiées',
  4: 'Spécifier un agent au moindre privilège, avec garde-fous et validation humaine, et situer un usage dans l’AI Act',
};

/* ---------- État et sauvegarde ---------- */
const lvState = () => ({ best: 0, passed: false, attempts: 0, errors: {}, stars: 0, pts: 0, rattrapage: false, restored: false, review: null, parts: null, secs: 0 });
function freshState() { return { player: { prenom: '', nom: '', email: '' }, levels: { 1: lvState(), 2: lvState(), 3: lvState(), 4: lvState() }, gates: {}, completedAt: null, session: '', unlockAll: false, ficheSent: false }; }
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const s = JSON.parse(raw), b = freshState();
      b.player = Object.assign(b.player, s.player || {});
      for (const n of [1, 2, 3, 4]) { b.levels[n] = Object.assign(lvState(), (s.levels || {})[n] || {}); b.levels[n].errors = b.levels[n].errors || {}; }
      b.gates = s.gates || {};
      b.completedAt = s.completedAt || null;
      b.satisfaction = s.satisfaction || null;
      b.badges = s.badges || {};
      b.session = typeof s.session === 'string' ? s.session : '';
      b.unlockAll = !!s.unlockAll; b.ficheSent = !!s.ficheSent;
      return b;
    }
  } catch (e) {}
  return freshState();
}
function saveState() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {} }
let state = loadState();
const playerName = () => `${state.player.prenom} ${state.player.nom}`.trim();
const normEmail = s => String(s || '').trim().toLowerCase();
// Renvoie un message d'erreur, ou '' si l'adresse est acceptée.
function emailError(e) {
  const v = normEmail(e);
  if (!v) return 'Renseignez votre adresse e-mail professionnelle.';
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) return 'Cette adresse e-mail n’est pas valide.';
  if (DOMAINE_EMAIL && !v.endsWith('@' + DOMAINE_EMAIL.toLowerCase())) return `Ce jeu est réservé aux adresses @${DOMAINE_EMAIL}. Utilisez votre adresse professionnelle.`;
  return '';
}

/* ---------- Suivi administrateur (webhook Make / Zapier) ---------- */
function topErrors(n, k = 3) {
  return Object.entries(state.levels[n].errors).sort((a, b) => b[1] - a[1]).slice(0, k).map(([t, c]) => `${t} (${c})`).join(' ; ');
}
/* =====================================================================
   GROUPE ACTIF (session)
   Le formateur active un groupe depuis la page formateur (index.html).
   Make l'écrit dans la cellule A2 de l'onglet « Config » d'une petite
   Google Sheet partagée en lecture ; chaque niveau la lit à l'ouverture.
   Un lien ?session=… reste possible et passe avant la feuille.
   Si le groupe change, le poste est remis à zéro (nouvel apprenant).
   ===================================================================== */
const cleanGroup = s => String(s || '').trim().replace(/[<>"]/g, '').slice(0, 60);
function readSessionFromLink() {
  try { return cleanGroup(new URLSearchParams(window.location.search).get('session') || ''); } catch (e) { return ''; }
}
async function fetchActiveGroup() {
  if (!CONFIG_SHEET_ID || CONFIG_SHEET_ID === 'ID_A_REMPLACER') return null;
  const url = `https://docs.google.com/spreadsheets/d/${encodeURIComponent(CONFIG_SHEET_ID)}/gviz/tq?tqx=out:csv&sheet=Config&range=A2&headers=0&t=${Date.now()}`;
  try {
    const ctrl = new AbortController(); const timer = setTimeout(() => ctrl.abort(), 3000);
    const r = await fetch(url, { cache: 'no-store', signal: ctrl.signal });
    clearTimeout(timer);
    if (!r.ok) return null;
    const txt = (await r.text()).trim();
    if (!txt || txt.startsWith('<')) return null;
    const first = txt.split(/\r?\n/)[0].replace(/^"|"$/g, '').replace(/""/g, '"');
    return cleanGroup(first) || null;
  } catch (e) { return null; }
}
function currentSession() { return readSessionFromLink() || state.session || ''; }
// Renvoie true si le poste a été remis à zéro parce que le groupe a changé.
function applyGroup(fromSheet) {
  const target = readSessionFromLink() || fromSheet || '';
  if (!target) return false;
  if (state.session && state.session !== target) {
    [1, 2, 3, 4].forEach(n => { if (state.levels[n].inProgress) sendAbandon(n, 'changement de groupe', true); });
    state = freshState(); state.session = target; saveState();
    toast(`Nouveau groupe : ${target}`, 'Ce poste a été remis à zéro. Saisissez votre prénom et votre nom.');
    return true;
  }
  if (!state.session) { state.session = target; saveState(); }
  return false;
}
async function syncGroup() { return applyGroup(await fetchActiveGroup()); }
const loadingView = () => '<section class="mt-16 text-center"><p class="eyebrow">Formation IA</p><p class="h2 mt-2">Chargement du groupe en cours…</p></section>';
function postWebhook(payload) {
  if (!WEBHOOK_URL || WEBHOOK_URL === 'URL_A_REMPLACER') { console.info('[Suivi] WEBHOOK_URL non configurée. Données qui auraient été envoyées :', payload); return; }
  try {
    // Format formulaire + mode no-cors : accepté par Make et Zapier sans pré-requête CORS.
    const body = new URLSearchParams(payload);
    // keepalive est limité à 64 Ko : on ne l'active que pour les petits envois.

function sendAbandon(n, raison, sansDetail) {

  if (!sansDetail && MODS[n] && MODS[n].progress) { try { prog = MODS[n].progress(); } catch (e) {} }

  const duree = Math.max(0, Math.round((fin - ip.start - (typeof attemptPausedMs === 'number' && !sansDetail ? attemptPausedMs : 0)) / 1000));
  delete L.inProgress;
  L.secs = (L.secs || 0) + duree;
  saveState();

    niveau_valide: '', score: '', seuil: String(SEUIL),
    tentative: String(prog.answered > 0 ? L.attempts : L.attempts + 1),

/* ---------- Console animée (niveaux 3 et 4) ---------- */
const LBL = { thought: 'Pensée', action: 'Action', obs: 'Observation', err: 'Échec', ok: 'OK', warn: 'Alerte', info: 'Info', final: 'Réponse finale' };
const lineHtml = e => `<div class="ln ln-${e.k}"><span class="lt">${LBL[e.k]}${e.it ? ` <span class="it">#${e.it}</span>` : ''}</span><span class="lx">${esc(e.t)}</span></div>`;
let playToken = 0;
function play(sess, events, onStep, onDone) {
  const token = ++playToken;
  sess.running = true; sess.log = [];
  render(false);
  const delay = reduceMotion() ? 0 : 520;
  let i = 0;
  const tick = () => {
    if (token !== playToken) return;
    if (i >= events.length) {
      sess.running = false; onDone(); render(false);
      const r = $('#result'); if (r) r.scrollIntoView({ behavior: reduceMotion() ? 'auto' : 'smooth', block: 'start' });
      return;
    }
    const e = events[i++]; sess.log.push(e); if (onStep) onStep(e);
    const c = $('#console');
    if (c) { if (sess.log.length === 1) c.innerHTML = ''; c.insertAdjacentHTML('beforeend', lineHtml(e)); c.scrollTop = c.scrollHeight; }
    if (delay === 0) tick(); else setTimeout(tick, delay);
  };
  tick();
}

/* ---------- Registre des niveaux ---------- */
const MODS = {};
const COURSE = {};

/* =====================================================================
   RÉCOMPENSES — points (sur 1 000), étoiles par niveau et badges
   ===================================================================== */
// Étoiles : 1 = niveau validé, 2 = score ≥ 95, 3 = score parfait (100).
const starsFor = (pct, passed) => !passed ? 0 : pct >= 100 ? 3 : pct >= 95 ? 2 : 1;
const starRow = (k, big) => `<span class="stars ${big ? 'big' : ''}" aria-label="${k} étoile${k > 1 ? 's' : ''} sur 3">${[1, 2, 3].map(i => `<span class="${i <= k ? 'on' : ''}">★</span>`).join('')}</span>`;
// Points d'un niveau validé : 2 points par point de score (200 au maximum) + bonus d'étoiles (10, 25 ou 50).
// Quatre niveaux parfaits = 1 000 points. Les points n'interviennent pas dans la validation.
const STAR_BONUS = [0, 10, 25, 50];
const ptsFor = (pct, stars) => Math.round(pct * 2) + STAR_BONUS[stars || 0];
const totalPts = () => [1, 2, 3, 4].reduce((a, k) => a + (state.levels[k].pts || 0), 0);
const BADGES = [
  { id: 'premier', g: '1', name: 'Du premier coup', how: 'Valider un niveau à la première tentative.' },
  { id: 'serie', g: '4', name: 'Série parfaite', how: 'Répondre juste aux 4 affirmations d’un échauffement.' },
  { id: 'intact', g: '♥', name: 'Sans égratignure', how: 'Valider un niveau sans perdre la moindre vie.' },
  { id: 'lynx', g: '◉', name: 'Œil de lynx', how: 'Trouver les 3 erreurs du détecteur d’hallucination, sans fausse alerte, en moins de 90 secondes.' },
  { id: 'tri', g: '⚡', name: 'Tri éclair', how: 'Réussir le tri express du niveau 1 sans faute en moins de 30 secondes.' },
  { id: 'feutre', g: '▮', name: 'Feutre noir infaillible', how: 'Masquer parfaitement le courrier au niveau 2.' },
  { id: 'archi', g: '⌂', name: 'Architecte sans fuite', how: 'Valider le niveau 3 sans incident à la première tentative.' },
  { id: 'boss', g: '⚔', name: 'Réflexes de survie', how: 'Battre le boss final sans faute en moins de 2 minutes.' },
  { id: 'certif', g: '✓', name: 'Concepteur certifié', how: 'Valider les quatre niveaux.' },
  { id: 'parfait', g: '★', name: 'Sans fausse note', how: 'Obtenir 3 étoiles aux quatre niveaux.' },
];
// Les niveaux renseignent ici les exploits propres à leur partie (détecteur, tri, feutre noir…).
const FEATS = {};
function earnBadge(id) {
  if (!state.badges) state.badges = {};
  if (state.badges[id]) return false;
  state.badges[id] = new Date().toISOString();
  const b = BADGES.find(x => x.id === id);
  if (b) toast(`Badge débloqué : ${b.name}`, b.how);
  return true;
}
// Appelé à chaque tentative terminée (voir finishAttempt).
function updateRewards(n, pct, passed) {
  const L = state.levels[n], st = starsFor(pct, passed);
  L.stars = Math.max(L.stars || 0, st);
  const f = FEATS[n] || {};
  if (passed && L.attempts === 1) earnBadge('premier');
  if (f.serie) earnBadge('serie');
  if (passed && f.intact) earnBadge('intact');
  if (f.lynx) earnBadge('lynx');
  if (f.tri) earnBadge('tri');
  if (f.feutre) earnBadge('feutre');
  if (n === 3 && passed && L.attempts === 1 && f.clean) earnBadge('archi');
  if (f.boss) earnBadge('boss');
  if ([1, 2, 3, 4].every(k => (state.levels[k].stars || 0) >= 3)) earnBadge('parfait');
  FEATS[n] = {};
}
function BadgeShelf(title = 'Vos badges') {
  const got = state.badges || {}, nb = BADGES.filter(b => got[b.id]).length;
  return `<section class="panel mt-6">
    <div class="flex items-center justify-between gap-3 flex-wrap"><h2 class="h3">${title}</h2><span class="pill">${nb} sur ${BADGES.length}</span></div>
    <div class="badge-grid mt-4">${BADGES.map(b => `<div class="badge ${got[b.id] ? 'on' : ''}" title="${esc(b.how)}"><span class="badge-medal" aria-hidden="true">${b.g}</span><div class="min-w-0"><b>${b.name}</b><small>${b.how}</small></div></div>`).join('')}</div>
    <p class="xs muted mt-3">Points : 2 par point de score d’un niveau validé, plus un bonus de 10, 25 ou 50 selon les étoiles (1 étoile au seuil de ${SEUIL}, 2 à partir de 95, 3 pour un score parfait). Badges et étoiles sont enregistrés sur cet appareil.</p>
  </section>`;
}

/* =====================================================================
   COMPTE À REBOURS (15 min, après l'échauffement) ET PAUSE
   ===================================================================== */
const CD_MINUTES = 15; // durée du défi de chaque niveau, en minutes (après l’échauffement)
const CD = { n: null, started: false, startAt: 0, pausedMs: 0, pausedAt: 0, stopped: false, timeUp: false };
const PAUSE_HOOKS = []; // fonctions(ms) appelées à la reprise, pour décaler les minuteurs internes d'un niveau
let attemptPausedMs = 0; // temps passé en pause pendant la tentative (exclu de la durée envoyée)
const isPaused = () => !!CD.pausedAt;
function cdReset(n) { if (isPaused()) resumeGame(true); Object.assign(CD, { n, started: false, startAt: 0, pausedMs: 0, pausedAt: 0, stopped: false, timeUp: false }); attemptPausedMs = 0; }
function cdStart(n) { if (CD.n !== n || CD.started) return; CD.started = true; CD.startAt = Date.now(); updateChrono(); }
function cdStop(n) { if (CD.n === n) CD.stopped = true; if (isPaused()) resumeGame(true); }
function cdLeftMs() {
  if (!CD.started) return CD_MINUTES * 60000;
  const now = CD.pausedAt || Date.now();
  return Math.max(0, CD_MINUTES * 60000 - (now - CD.startAt - CD.pausedMs));
}
// Libellé du bandeau (appelé par updateChrono).
function cdLabel() {
  if (!CD.n || CD.n !== chrono.n || CD.stopped) return null;
  if (CD.timeUp) return { txt: 'Temps écoulé', cls: 'cd-urgent' };
  if (!CD.started) return { txt: `${fmtDur(CD_MINUTES * 60)} · après l’échauffement`, cls: '' };
  const s = Math.ceil(cdLeftMs() / 1000);
  return { txt: `${isPaused() ? 'Pause ' : 'Reste '}${fmtDur(s)}`, cls: s <= 60 ? 'cd-urgent' : s <= 300 ? 'cd-warn' : '' };
}
function pauseGame() {
  if (isPaused() || !chrono.n || chrono.end || CD.timeUp) return;
  CD.pausedAt = Date.now();
  document.body.classList.add('game-paused');
  let v = document.getElementById('pause-veil');
  if (!v) { v = document.createElement('div'); v.id = 'pause-veil'; document.body.appendChild(v); }
  v.innerHTML = `<div class="pause-card" role="dialog" aria-modal="true" aria-labelledby="pause-t"><p class="eyebrow">Formation IA</p><h2 class="h2 mt-1" id="pause-t">Jeu en pause</h2><p class="mt-2 small muted">Le compte à rebours est arrêté et le jeu est masqué. Reprenez quand vous êtes prêt.</p><button class="btn btn-primary mt-4" data-action="resume" id="resume-btn">Reprendre</button></div>`;
  v.hidden = false; const b = document.getElementById('resume-btn'); if (b) b.focus();
  updateChrono(); syncPauseBtn();
}
function resumeGame(silent) {
  if (!isPaused()) return;
  const ms = Date.now() - CD.pausedAt;
  if (CD.started) CD.pausedMs += ms;
  attemptPausedMs += ms;
  CD.pausedAt = 0;
  document.body.classList.remove('game-paused');
  const v = document.getElementById('pause-veil'); if (v) v.hidden = true;
  PAUSE_HOOKS.forEach(f => { try { f(ms); } catch (e) {} });
  if (!silent) { updateChrono(); syncPauseBtn(); }
}
function syncPauseBtn() {
  const b = document.getElementById('pause-btn'); if (!b) return;
  const show = !!chrono.n && !chrono.end && !CD.timeUp && typeof inLevelView === 'function' && inLevelView();
  b.hidden = !show; b.textContent = isPaused() ? 'Reprendre' : 'Pause';
  b.setAttribute('aria-pressed', isPaused());
}
setInterval(() => {
  syncPauseBtn();
  if (CD.n && CD.started && !CD.stopped && !CD.timeUp && !isPaused() && cdLeftMs() <= 0) cdTimeUp(CD.n);
}, 500);
// Temps écoulé : la tentative est enregistrée comme abandonnée (motif « temps écoulé »), sans score inventé.
function cdTimeUp(n) {
  CD.timeUp = true;
  try { sendAbandon(n, `temps écoulé (${CD_MINUTES} min)`); } catch (e) {}
  chrono.n = n; chrono.end = Date.now();
  if (typeof render === 'function' && inLevelView()) render(true);
}
function TimeUpView(n) {
  return `${LevelHeader(n)}<section class="panel" id="result">
    <span class="pill pill-bad"><span class="dot"></span>Temps écoulé</span>
    <h2 class="h2 mt-3">Les ${CD_MINUTES} minutes sont passées</h2>
    <p class="mt-2">Le niveau n’est pas validé et cette tentative est enregistrée comme interrompue. Vos réponses ne sont pas perdues pour l’apprentissage : rejouez le niveau : l’échauffement et le compte à rebours repartent de zéro.</p>
    <p class="small muted mt-2">Astuce : le bouton « Pause » du bandeau arrête le compte à rebours si vous devez vous interrompre.</p>
    <div class="flex flex-wrap gap-3 mt-6"><button class="btn btn-primary" data-action="retry" data-n="${n}">Rejouer le niveau</button></div>
  </section>`;
}
document.addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('[data-action="pause"],[data-action="resume"]');
  if (!b) return;
  e.stopPropagation();
  isPaused() ? resumeGame() : pauseGame();
}, true);
// Pendant la pause, le clavier ne joue plus (sauf Échap / Entrée pour reprendre).
window.addEventListener('keydown', e => {
  if (!isPaused()) return;
  if (e.key === 'Escape' || e.key === 'Enter') { e.preventDefault(); resumeGame(); }
  else if (e.key !== 'Tab') { e.preventDefault(); }
  e.stopImmediatePropagation();
}, true);
// Changement d'onglet ou mise en veille : pas de pause automatique (le formateur reste maître), mais le décompte se recale.

/* =====================================================================
   MOTEUR DES NIVEAUX — épreuves enchaînées, vies, points, rattrapage
   Chaque niveau est une suite d'épreuves (« stages ») :
   échauffement vrai ou faux, épreuves rapides (qui coûtent des vies),
   ateliers (jugés à la fin, sans vie en jeu).
   ===================================================================== */
const LIVES = 3;            // vies par niveau, pour les épreuves rapides
const LIFE_PER_ERROR = 0.5; // une erreur = une demi-vie : la partie s'arrête à la 6e erreur
const RATT_MAX = 8;         // au-delà de 8 éléments ratés, on rejoue le niveau
const RATT_MIN_PCT = 50;    // en dessous de 50/100, on rejoue le niveau

/* Explication courte + « En savoir plus » dépliable. */
function fbx(txt) {
  const s = String(txt || '');
  const m = s.slice(30).search(/[.!?»] /);
  if (m < 0) return `<p>${s}</p>`;
  const cut = 30 + m + 1, head = s.slice(0, cut).trim(), rest = s.slice(cut).trim();
  if (rest.length < 50) return `<p>${s}</p>`;
  return `<p>${head}</p><details class="more"><summary>En savoir plus</summary><p>${rest}</p></details>`;
}
const fmtLives = v => String(v).replace('.', ',');

/* ---------- Registre des parties en cours ---------- */
const RUN = {};      // RUN[n] : partie en cours du niveau n
const LEVELS = {};   // LEVELS[n] : configuration du niveau (épreuves, pondérations…)

function makeLevel(n, cfg) {
  LEVELS[n] = cfg;
  MODS[n] = {
    start() {
      RUN[n] = { n, i: 0, st: cfg.stages.map(s => s.init()), over: false, recorded: false, res: null, ratt: null, view: 'play' };
    },
    view() { return runView(n); },
    handle(a, d, b) { return runHandle(n, a, d, b); },
    progress() { return runProgress(n); },
    details() { return runDetails(n); },
    live() { return runLive(n); },
  };
}
const R = n => RUN[n];
const stageOf = (n, k) => LEVELS[n].stages[k];
const curStage = n => stageOf(n, R(n).i);
const quickErrors = n => LEVELS[n].stages.reduce((a, s, k) => a + (s.quick && s.errors ? s.errors(R(n).st[k]) : 0), 0);
const livesLeft = n => Math.max(0, LIVES - quickErrors(n) * LIFE_PER_ERROR);
const hasQuick = n => LEVELS[n].stages.some(s => s.quick);
function checkOver(n) { if (hasQuick(n) && livesLeft(n) <= 0) R(n).over = true; }
function heartsHtml(n) {
  if (!hasQuick(n)) return '';
  const l = livesLeft(n);
  return `<span class="pill lives" title="Une erreur dans une épreuve rapide coûte une demi-vie" aria-label="${fmtLives(l)} vie${l > 1 ? 's' : ''} sur ${LIVES}">${[...Array(LIVES)].map((_, i) => `<span class="${l >= i + 1 ? 'on' : (l > i ? 'half' : '')}">♥</span>`).join('')}</span>`;
}
/* Bouton de fin d'étape : « plus de vies », épreuve suivante ou résultat. */
function nextCtl(n, label) {
  const r = R(n);
  if (r.over) return `<button class="btn btn-primary" data-action="run-result">Plus de vies : voir mon résultat</button>`;
  const last = r.i >= LEVELS[n].stages.length - 1;
  return `<button class="btn btn-primary" data-action="${last ? 'run-result' : 'run-next'}">${label || (last ? 'Voir mon résultat' : `Épreuve suivante : ${stageOf(n, r.i + 1).name}`)}</button>`;
}
/* Bouton « suivant » à l'intérieur d'une épreuve (question suivante…), remplacé par « plus de vies » si besoin. */
function innerCtl(n, action, label) {
  return R(n).over ? `<button class="btn btn-primary" data-action="run-result">Plus de vies : voir mon résultat</button>` : `<button class="btn btn-primary" data-action="${action}">${label}</button>`;
}
function stageHead(n, extra) {
  const r = R(n), S = LEVELS[n].stages, s = S[r.i];
  return `<div class="flex items-center justify-between gap-3 flex-wrap">
    <p class="eyebrow">${r.i === 0 ? 'Échauffement' : `Épreuve ${r.i} sur ${S.length - 1}`} · ${s.name}${s.quick ? ' · <span class="muted">épreuve rapide</span>' : s.atelier ? ' · <span class="muted">atelier, sans vie en jeu</span>' : ''}</p>
    <div class="flex items-center gap-3">${r.i > 0 ? heartsHtml(n) : ''}${extra || ''}</div>
  </div>`;
}
/* Fil des épreuves sous le titre du niveau. */
function stageRail(n) {
  const r = R(n); if (!r || typeof view !== 'number' || view !== n) return '';
  const S = LEVELS[n].stages;
  return `<ol class="rail mt-3" aria-label="Épreuves du niveau">${S.map((s, k) => `<li class="${r.view !== 'play' || k < r.i ? 'done' : k === r.i ? 'cur' : ''}">${k === 0 ? 'Échauffement' : s.name}</li>`).join('')}<li class="${r.view !== 'play' ? 'cur' : ''}">Résultat</li></ol>`;
}

/* ---------- Vue et actions ---------- */
function runView(n) {
  const r = R(n);
  if (typeof CD !== 'undefined' && CD.timeUp && CD.n === n) return TimeUpView(n);
  if (r.view === 'result') return LevelHeader(n) + RunResult(n);
  if (r.view === 'ratt') return LevelHeader(n) + RattView(n);
  const s = curStage(n);
  return LevelHeader(n) + s.view(r.st[r.i], n);
}
function runHandle(n, a, d, b) {
  const r = R(n);
  if (a === 'run-next') {
    if (r.over) return true;
    if (r.i === 0 && typeof cdStart === 'function') cdStart(n);
    r.i = Math.min(r.i + 1, LEVELS[n].stages.length - 1);
    const s = curStage(n); if (s.enter) s.enter(r.st[r.i], n);
    render(true); return true;
  }
  if (a === 'run-result') { r.view = 'result'; render(true); return true; }
  if (a === 'ratt-start') { RattStart(n); render(true); return true; }
  if (a === 'ratt-pick') { RattPick(n, +d.k); render(false); return true; }
  if (a === 'ratt-next') { r.ratt.i++; if (r.ratt.i >= r.ratt.items.length) RattEnd(n); render(true); return true; }
  if (r.view !== 'play') return false;
  const s = curStage(n);
  const wasOver = r.over;
  if (s.handle && s.handle(a, d, r.st[r.i], n, b)) { checkOver(n); if (!wasOver && r.over) render(false); return true; }
  return false;
}
function runProgress(n) {
  const r = R(n), S = LEVELS[n].stages;
  let answered = 0; const parts = [];
  S.forEach((s, k) => { const p = s.progress(r.st[k]); answered += p.answered; if (k <= r.i) parts.push(`${k === 0 ? 'échauffement' : s.name.toLowerCase()} : ${p.txt}`); });
  if (hasQuick(n)) parts.push(`${fmtLives(livesLeft(n))} vie(s) restante(s)`);
  return { answered, txt: parts.join(' ; ') };
}
function runDetails(n) {
  const r = R(n);
  return LEVELS[n].stages.flatMap((s, k) => s.details(r.st[k]));
}
/* Score du niveau : moyenne pondérée des épreuves (ou points uniformes au niveau 1). */
function stagePct(s, st) { if (s.pct) return s.pct(st); const sc = s.score(st); return sc.total ? sc.good / sc.total * 100 : 0; }
function runScore(n) {
  const cfg = LEVELS[n], r = R(n);
  if (cfg.uniform) {
    let g = 0, t = 0; cfg.stages.forEach((s, k) => { const sc = s.score(r.st[k]); g += sc.good; t += sc.total; });
    return { pct: Math.round(g / t * 100), good: g, total: t };
  }
  const W = cfg.weights, sw = W.reduce((a, b) => a + b, 0);
  return { pct: Math.round(cfg.stages.reduce((a, s, k) => a + W[k] * stagePct(s, r.st[k]), 0) / sw) };
}
// Avancement pour les points en direct (0 à 1) : seules les réponses déjà données comptent.
function runLive(n) {
  const cfg = LEVELS[n], r = R(n); if (!r) return 0;
  if (r.view !== 'play') return r.res ? r.res.pct / 100 : 0;
  if (cfg.uniform) {
    let g = 0, t = 0; cfg.stages.forEach((s, k) => { g += s.score(r.st[k]).good; t += s.score(r.st[k]).total; });
    return g / t;
  }
  const W = cfg.weights, sw = W.reduce((a, b) => a + b, 0);
  return cfg.stages.reduce((a, s, k) => a + W[k] * (s.livePct ? s.livePct(r.st[k]) : (s.complete(r.st[k]) ? stagePct(s, r.st[k]) : 0)), 0) / sw / 100;
}

/* ---------- Résultat ---------- */
function runRecord(n) {
  const r = R(n), cfg = LEVELS[n];
  if (r.res) return r.res;
  const sc = runScore(n);
  const inc = cfg.incident ? cfg.incident(r) : null;
  const passed = !r.over && !inc && sc.pct >= SEUIL;
  const det = runDetails(n), all = det.flatMap(sec => sec.items);
  all.forEach(i => { if (i.why) i.why = String(i.why).replace(/^(Exact|Correct|Vrai|Faux)\.\s*/, ''); });
  const misses = all.filter(i => !i.ok);
  const errs = [...new Set(cfg.stages.flatMap((s, k) => s.errTags ? s.errTags(r.st[k]) : []))];
  if (inc) errs.unshift(`Incident : ${inc.label}`);
  const feats = { intact: hasQuick(n) && quickErrors(n) === 0 };
  cfg.stages.forEach((s, k) => { if (s.feats) Object.assign(feats, s.feats(r.st[k])); });
  FEATS[n] = feats;
  const ratt = misses.filter(i => i.given && i.expected && i.given !== 'sans réponse' && i.given !== i.expected);
  const rattOk = !passed && !r.over && sc.pct >= RATT_MIN_PCT && ratt.length > 0 && ratt.length <= RATT_MAX && misses.every(i => i.given !== 'sans réponse');
  r.res = { pct: sc.pct, passed, inc, misses, ratt: rattOk ? ratt : null, sc };

}
function RunResult(n) {
  const r = R(n), cfg = LEVELS[n], res = runRecord(n), { pct, passed, inc } = res;
  const stars = starsFor(pct, passed), pts = passed ? ptsFor(pct, stars) : 0;
  const cards = cfg.stages.map((s, k) => `<div class="card"><p class="eyebrow grey">${k === 0 ? 'Échauffement' : s.name}</p><p class="h3 num mt-1">${s.summary(r.st[k])}</p></div>`).join('');
  const t = cfg.resultText ? cfg.resultText(r, res) : {};
  const headline = r.over ? 'Plus de vies : la partie s’arrête ici' : inc ? inc.label : passed ? (t.ok || 'Niveau validé') : `Pas encore ${SEUIL} : il manque ${SEUIL - pct} point${SEUIL - pct > 1 ? 's' : ''}`;
  const text = r.over ? `Six erreurs dans les épreuves rapides : les trois vies sont perdues. Relisez la correction ci-dessous, puis rejouez : l’ordre des questions change à chaque partie.`
    : inc ? `${inc.why} ${res.ratt ? 'Le rattrapage ciblé reprend uniquement les éléments en cause.' : 'Corrigez les éléments en rouge puis rejouez.'}`
    : passed ? (t.okText || '') : res.ratt ? `Bonne nouvelle : pas besoin de tout rejouer. Le rattrapage ciblé reprend uniquement vos ${res.ratt.length} erreur${res.ratt.length > 1 ? 's' : ''} ; réussissez-les toutes et le niveau est validé à ${SEUIL}/100.` : `La validation demande ${SEUIL}/100. Relisez la correction ci-dessous, puis rejouez le niveau.`;
  const review = res.misses.length ? `<details class="more mt-6"${passed ? '' : ' open'}><summary>Revoir la correction (${res.misses.length} élément${res.misses.length > 1 ? 's' : ''} à revoir)</summary>
      <div class="mt-2">${res.misses.map(i => `<div class="review"><span class="mark n">✗</span><div class="min-w-0"><b>${esc(i.label)}</b>${i.given ? `<p class="small mt-1"><span class="muted">Votre réponse :</span> ${esc(i.given)}</p>` : ''}${i.expected ? `<p class="small"><b style="color:var(--ok)">Attendu :</b> ${esc(i.expected)}</p>` : ''}${i.why ? `<p class="muted small mt-1">${esc(i.why)}</p>` : ''}</div></div>`).join('')}</div></details>` : '';
  const next = n < 4 ? `<button class="btn btn-ok" data-action="summary" data-n="${n}">Résumé de cours, puis niveau ${n + 1}</button>` : `<button class="btn btn-ok" data-action="summary" data-n="${n}">Résumé de cours, puis certificat</button>`;
  return `<section class="panel" id="result">
    <div class="grid gap-6 md:grid-cols-[220px_minmax(0,1fr)] items-start">
      <div>
        <p class="eyebrow grey">Score du niveau</p>
        <div class="score-big mt-2" style="color:var(${passed ? '--ok' : '--bad'})">${pct}<span style="font-size:24px">/100</span></div>
        <div class="gauge" aria-hidden="true"><div class="gauge-fill ${passed ? 'ok' : ''}" style="width:${pct}%"></div><div class="gauge-mark" style="left:${SEUIL}%"><span>seuil ${SEUIL}</span></div></div>
        ${passed ? `<p class="pts-won mt-4">+${pts} points</p>` : ''}
      </div>
      <div class="min-w-0">
        <span class="pill ${passed ? 'pill-ok' : 'pill-bad'}"><span class="dot"></span>${passed ? 'Niveau validé' : 'Niveau non validé'}</span>
        ${passed ? `<div class="mt-3">${starRow(stars, true)}${pct < 100 ? `<span class="xs muted" style="margin-left:8px">${pct >= 95 ? '100/100 pour la 3e étoile' : '95 pour la 2e étoile'}</span>` : ''}</div>` : ''}
        <h2 class="h2 mt-3">${headline}</h2>
        <p class="mt-2 prose">${text}</p>
      </div>
    </div>
    <div class="res-grid mt-6">${cards}</div>
    ${hasQuick(n) ? `<p class="small muted mt-3">Vies restantes : ${fmtLives(livesLeft(n))} sur ${LIVES}.${cfg.uniform ? ` Score : ${res.sc.good} points sur ${res.sc.total}.` : ''}</p>` : ''}
    ${cfg.resultExtra ? cfg.resultExtra(r, res) : ''}
    <div class="flex flex-wrap gap-3 mt-6">
      ${passed ? `${next}<button class="btn btn-ghost" data-action="retry" data-n="${n}">Rejouer pour les étoiles</button>`
        : `${res.ratt ? `<button class="btn btn-primary" data-action="ratt-start">Rattrapage ciblé : ${res.ratt.length} question${res.ratt.length > 1 ? 's' : ''} (≈ ${Math.max(1, Math.ceil(res.ratt.length * 0.4))} min)</button>` : ''}
           <button class="btn ${res.ratt ? 'btn-ghost' : 'btn-primary'}" data-action="retry" data-n="${n}">Rejouer le niveau</button>`}
    </div>
    ${review}
  </section>`;
}

/* ---------- Rattrapage ciblé ---------- */
function RattStart(n) {
  const r = R(n), items = r.res.ratt;
  r.ratt = { items, i: 0, picks: [], perm: items.map(() => Math.random() < .5 ? [0, 1] : [1, 0]), done: false, ok: false };
  r.view = 'ratt';
}
function RattPick(n, k) { const t = R(n).ratt; if (t.picks[t.i] === undefined) t.picks[t.i] = k; }
function RattEnd(n) {
  const r = R(n), t = r.ratt; if (t.done) return;
  t.done = true;
  const good = t.picks.filter(p => p === 0).length;
  t.ok = good === t.items.length;
  const errs = t.items.filter((_, k) => t.picks[k] !== 0).map(i => i.label.length > 70 ? i.label.slice(0, 67) + '…' : i.label);
  finishRattrapage(n, t.ok, good, t.items.length, errs);
}
function RattView(n) {
  const r = R(n), t = r.ratt, nb = t.items.length;
  if (t.done) {
    return `<section class="panel" id="result">
      <span class="pill ${t.ok ? 'pill-ok' : 'pill-bad'}"><span class="dot"></span>${t.ok ? 'Rattrapage réussi' : 'Rattrapage non réussi'}</span>
      <h2 class="h2 mt-3">${t.ok ? `Niveau ${n} validé à ${SEUIL}/100` : 'Encore un effort'}</h2>
      <p class="mt-2 prose">${t.ok ? `Vous avez corrigé vos ${nb} erreur${nb > 1 ? 's' : ''}. Le niveau est validé avec le score du seuil (${SEUIL}/100) et une étoile ; rejouez-le plus tard pour viser les trois étoiles.` : `${t.picks.filter(p => p === 0).length} bonne${t.picks.filter(p => p === 0).length > 1 ? 's' : ''} réponse${t.picks.filter(p => p === 0).length > 1 ? 's' : ''} sur ${nb} : le rattrapage demande un sans-faute. Rejouez le niveau ; les explications que vous venez de lire vous aideront.`}</p>
      <div class="flex flex-wrap gap-3 mt-6">${t.ok ? `<button class="btn btn-ok" data-action="summary" data-n="${n}">Résumé de cours, puis ${n < 4 ? `niveau ${n + 1}` : 'certificat'}</button>` : `<button class="btn btn-primary" data-action="retry" data-n="${n}">Rejouer le niveau</button>`}</div>
    </section>`;
  }
  const it = t.items[t.i], p = t.picks[t.i], answered = p !== undefined, ok = p === 0;
  const optTxt = [it.expected, it.given];
  const dots = t.items.map((_, k) => `<span class="qdot ${k < t.i || (k === t.i && answered) ? (t.picks[k] === 0 ? 'y' : 'n') : (k === t.i ? 'cur' : '')}"></span>`).join('');
  const opts = t.perm[t.i].map((k, pos) => {
    let c = 'opt';
    if (answered) c += k === p ? (k === 0 ? ' ok' : ' bad') : (k === 0 ? ' ok-reveal' : ' fade');
    return `<button class="${c}" data-action="ratt-pick" data-k="${k}" ${answered ? 'disabled' : ''}><span class="key">${'AB'[pos]}</span><span class="opt-body">${esc(optTxt[k])}</span></button>`;
  }).join('');
  return `<section class="panel min-w-0">
    <div class="flex items-center justify-between gap-3 flex-wrap"><p class="eyebrow">Rattrapage ciblé · ${t.i + 1} sur ${nb}</p><div class="qdots" aria-hidden="true">${dots}</div></div>
    <p class="small muted mt-1">Uniquement vos erreurs, sans chrono ni vie en jeu. Un sans-faute valide le niveau.</p>
    <div class="card mt-4"><p class="eyebrow grey">À corriger</p><p class="mt-1" style="font-size:17px;font-weight:600">${esc(it.label)}</p></div>
    <h2 class="h3 mt-5">Quelle est la bonne réponse ?</h2>
    <div class="grid gap-2 mt-3">${opts}</div>
    ${answered ? `<div class="fb ${ok ? 'fb-ok' : 'fb-bad'} mt-5" role="status"><div class="fb-head">${ok ? '✓ Corrigé' : '✗ Pas encore'}</div>${fbx(esc(it.why || ''))}</div>
      <div class="flex justify-end mt-5"><button class="btn btn-primary" data-action="ratt-next">${t.i < nb - 1 ? 'Question suivante' : 'Terminer le rattrapage'}</button></div>` : ''}
  </section>`;
}

/* ---------- Vrai ou faux éclair (échauffement : 4 affirmations tirées au sort, 2 vraies et 2 fausses) ---------- */
const TF_PER_LEVEL = 4;
function tfStage(n, data) {
  return {
    id: 'tf', name: 'Vrai ou faux éclair',
    init() {
      const t = shuffle(data.map((q, k) => k).filter(k => data[k].v)).slice(0, TF_PER_LEVEL / 2);
      const f = shuffle(data.map((q, k) => k).filter(k => !data[k].v)).slice(0, TF_PER_LEVEL / 2);
      return { order: shuffle([...t, ...f]), i: 0, picks: {}, streak: 0, best: 0 };
    },
    good: st => st.order.filter(k => st.picks[k] === data[k].v).length,
    score(st) { return { good: this.good(st), total: st.order.length }; },
    livePct(st) { return this.good(st) / st.order.length * 100; },
    complete: st => st.i >= st.order.length,
    summary(st) { return `${this.good(st)} / ${st.order.length}`; },
    progress(st) { const nb = Object.keys(st.picks).length; return { answered: nb, txt: `${nb}/${st.order.length} (${this.good(st)} juste${this.good(st) > 1 ? 's' : ''})` }; },
    errTags: st => st.order.filter(k => st.picks[k] !== undefined && st.picks[k] !== data[k].v).map(k => data[k].tag),
    feats(st) { return { serie: this.good(st) === st.order.length }; },
    details(st) {
      return [{ title: 'Vrai ou faux éclair', items: st.order.map(k => { const q = data[k], g = st.picks[k];
        return { label: q.t, ok: g === q.v, given: g === undefined ? 'sans réponse' : (g ? 'Vrai' : 'Faux'), expected: q.v ? 'Vrai' : 'Faux', why: q.fb }; }) }];
    },
    view(st, n) {
      const D = data;
      if (st.i >= st.order.length) {
        const g = this.good(st);
        return `<section class="panel tf-end" id="tf-stage">${stageHead(n)}
          <h2 class="h2 mt-2">${g} sur ${st.order.length} en vrai ou faux</h2>
          <p class="mt-2">Meilleure série : <b>${st.best}</b>. Place au défi : <b>${CD_MINUTES} minutes</b> au compte à rebours (bouton Pause dans le bandeau) et <b>${LIVES} vies</b>, une erreur coûtant une demi-vie dans les épreuves rapides.</p>
          <div class="tf-recap mt-4">${st.order.map(k => `<span class="qdot ${st.picks[k] === D[k].v ? 'y' : 'n'}" title="${esc(D[k].tag)}"></span>`).join('')}</div>
          <div class="flex justify-end mt-6">${nextCtl(n, `Lancer le défi : ${stageOf(n, 1).name}`)}</div>
        </section>`;
      }
      const k = st.order[st.i], q = D[k], ans = st.picks[k], answered = ans !== undefined, ok = answered && ans === q.v;
      const dots = st.order.map((kk, p) => `<span class="qdot ${p < st.i || (p === st.i && answered) ? (st.picks[kk] === D[kk].v ? 'y' : 'n') : (p === st.i ? 'cur' : '')}"></span>`).join('');
      const btn = (val, label, key) => {
        let c = `tf-btn tf-${val ? 'true' : 'false'}`;
        if (answered) c += ans === val ? (ok ? ' ok' : ' bad') : (q.v === val ? ' ok-reveal' : ' fade');
        return `<button class="${c}" data-action="tf-pick" data-v="${val ? 1 : 0}" ${answered ? 'disabled' : ''}><b>${label}</b><small>touche ${key}</small></button>`;
      };
      return `<section class="panel min-w-0" id="tf-stage">
        ${stageHead(n, `<span class="pill tf-streak ${st.streak >= 3 ? 'hot' : ''}">Série : ${st.streak}</span><div class="qdots" aria-hidden="true">${dots}</div>`)}
        <p class="small muted mt-1">${st.i + 1} sur ${st.order.length} · sans chrono ni vie en jeu</p>
        <div class="tf-card mt-4 ${answered ? (ok ? 'is-ok' : 'is-bad') : ''}"><p>${q.t}</p></div>
        <div class="tf-actions mt-4">${btn(true, 'Vrai', 'V')}${btn(false, 'Faux', 'F')}</div>
        ${answered ? `<div class="fb ${ok ? 'fb-ok' : 'fb-bad'} mt-5" role="status"><div class="fb-head">${ok ? '✓ Bien vu' : '✗ Raté'}${ok && st.streak >= 3 ? ` · série de ${st.streak} !` : ''}</div>${fbx(q.fb)}</div>
          <div class="flex justify-end mt-5"><button class="btn btn-primary" data-action="tf-next">${st.i < st.order.length - 1 ? 'Affirmation suivante' : 'Voir mon échauffement'}</button></div>` : ''}
      </section>`;
    },
    handle(a, d, st) {
      if (a === 'tf-pick') {
        const k = st.order[st.i]; if (st.picks[k] !== undefined) return true;
        const v = d.v === '1'; st.picks[k] = v;
        if (v === data[k].v) { st.streak++; st.best = Math.max(st.best, st.streak); } else st.streak = 0;
        render(false); return true;
      }
      if (a === 'tf-next') { st.i++; render(false); return true; }
      return false;
    },
  };
}
document.addEventListener('keydown', e => {
  if (!$('#tf-stage') || e.ctrlKey || e.metaKey || e.altKey || /input|textarea/i.test((e.target.tagName || ''))) return;
  const key = e.key.toLowerCase();
  const b = key === 'v' ? $('[data-action="tf-pick"][data-v="1"]') : key === 'f' ? $('[data-action="tf-pick"][data-v="0"]') : null;
  if (b && !b.disabled) { e.preventDefault(); b.click(); }
});

/* ---------- Questions à choix (situations, pièges, boss…) : épreuve rapide ---------- */
// items : { who?, scenario, q, opts: [{ t, ok?, fb }], concept?, tag, mod? }
// o : { id, name, items, intro?, top?(st, n), timer?: secondes (indicatif), endText?(st, good, n), label? }
function qcmStage(o) {
  const items = o.items;
  return {
    id: o.id, name: o.name, quick: true,
    init: () => ({ i: 0, picks: [], perm: items.map(q => o.fixed ? q.opts.map((_, k) => k) : shuffle(q.opts.map((_, k) => k))), start: 0, end: 0 }),
    enter(st) { st.start = Date.now(); },
    good: st => st.picks.filter((p, k) => p !== undefined && items[k].opts[p].ok).length,
    errors: st => st.picks.filter((p, k) => p !== undefined && !items[k].opts[p].ok).length,
    score(st) { return { good: this.good(st), total: items.length }; },
    livePct(st) { return this.good(st) / items.length * 100; },
    complete: st => st.i >= items.length,
    summary(st) { return `${this.good(st)} / ${items.length}`; },
    progress(st) { const nb = st.picks.filter(p => p !== undefined).length; return { answered: nb, txt: `${nb}/${items.length} (${this.good(st)} juste${this.good(st) > 1 ? 's' : ''})` }; },
    errTags: st => items.filter((q, k) => st.picks[k] !== undefined && !q.opts[st.picks[k]].ok).map(q => q.tag),
    feats(st) { return o.feats ? o.feats(st, this.good(st)) : {}; },
    details(st) {
      return [{ title: o.name, items: items.map((q, k) => {
        const p = st.picks[k], c = p === undefined ? null : q.opts[p], g = q.opts.find(x => x.ok);
        return { label: o.label ? o.label(q) : q.q, ok: !!(c && c.ok), given: c ? c.t : 'sans réponse', expected: g.t, why: `${(c && c.ok ? c.fb : g.fb)}${q.concept ? ' ' + q.concept : ''}` };
      }) }];
    },
    view(st, n) {
      if (st.i >= items.length) {
        if (!st.end) st.end = Date.now();
        const g = this.good(st);
        return `<section class="panel">${stageHead(n)}
          <h2 class="h2 mt-2">${o.name} : ${g} sur ${items.length}</h2>
          <p class="mt-2">${o.endText ? o.endText(st, g, n) : ''}</p>
          <div class="flex justify-end mt-6">${nextCtl(n)}</div></section>`;
      }
      const q = items[st.i], p = st.picks[st.i], answered = p !== undefined;
      const dots = items.map((qq, k) => `<span class="qdot ${k < st.i || (k === st.i && answered) ? (qq.opts[st.picks[k]].ok ? 'y' : 'n') : (k === st.i ? 'cur' : '')}"></span>`).join('');
      const opts = st.perm[st.i].map((k, pos) => {
        const op = q.opts[k]; let c = 'opt';
        if (answered) { if (k === p) c += op.ok ? ' ok' : ' bad'; else if (op.ok) c += ' ok-reveal'; else c += ' fade'; }
        return `<button class="${c}" data-action="qcm-pick" data-k="${k}" ${answered ? 'disabled' : ''}><span class="key">${'ABCD'[pos]}</span><span class="opt-body">${op.t}</span></button>`;
      }).join('');
      const chosen = answered ? q.opts[p] : null, good = q.opts.find(x => x.ok);
      const clock = o.timer ? `<span class="pill num det-timer" id="qcm-clock" data-limit="${o.timer}">${o.timer} s</span>` : '';
      return `<section class="panel min-w-0" id="qcm-stage">
        ${stageHead(n, `${clock}<div class="qdots" aria-hidden="true">${dots}</div>`)}
        ${st.i === 0 && o.intro ? `<p class="small muted mt-1">${o.intro}</p>` : `<p class="small muted mt-1">${st.i + 1} sur ${items.length}</p>`}
        ${o.top ? o.top(st, n) : ''}
        ${q.scenario ? `<div class="card mt-4">${q.who ? `<div class="mb-3">${person(q.who, 44)}</div>` : ''}<p>${q.scenario}</p></div>` : ''}
        <h2 class="h3 mt-5">${q.q}</h2>
        <div class="grid gap-2 mt-3">${opts}</div>
        ${answered ? `<div class="fb ${chosen.ok ? 'fb-ok' : 'fb-bad'} mt-5" role="status">
            <div class="fb-head">${chosen.ok ? '✓ Bonne réponse' : '✗ Raté · une demi-vie en moins'}</div>
            ${chosen.ok ? fbx(chosen.fb) : `<p><b>Bonne réponse :</b> ${good.t}</p>${fbx(good.fb)}`}
          </div>
          ${q.concept ? `<div class="callout mt-4"><span class="eyebrow">À retenir${q.mod ? ' · ' + q.mod : ''}</span><p>${q.concept}</p></div>` : ''}
          <div class="flex justify-end mt-5">${innerCtl(n, 'qcm-next', st.i < items.length - 1 ? 'Question suivante' : 'Terminer l’épreuve')}</div>` : ''}
      </section>`;
    },
    handle(a, d, st) {
      if (a === 'qcm-pick') { if (st.picks[st.i] === undefined) { st.picks[st.i] = +d.k; render(false); } return true; }
      if (a === 'qcm-next') { st.i++; if (st.i >= items.length) st.end = Date.now(); render(false); return true; }
      return false;
    },
  };
}

/* ---------- Tri express (glisser-déposer dans des bacs) : épreuve rapide ---------- */
// o : { id, name, bins: [{ id, name, sub, cls }], cards: [{ t, bin, tag, fb }], intro, endText?, badgeSecs? }
let ACTIVE_TRI = null; // { st, o, n } de l'épreuve de tri affichée
function triStage(o) {
  const nameOf = id => o.bins.find(b => b.id === id).name;
  return {
    id: o.id, name: o.name, quick: true,
    init: () => ({ order: shuffle(o.cards.map((_, k) => k)), i: 0, picks: [], start: 0, end: 0, fb: null }),
    enter(st) { st.start = Date.now(); },
    errors: st => st.picks.filter((b, k) => b !== undefined && b !== o.cards[st.order[k]].bin).length,
    good: st => st.picks.filter((b, k) => b !== undefined && b === o.cards[st.order[k]].bin).length,
    score(st) { return { good: this.good(st), total: o.cards.length }; },
    livePct(st) { return this.good(st) / o.cards.length * 100; },
    complete: st => st.i >= o.cards.length,
    summary(st) { return `${this.good(st)} / ${o.cards.length}`; },
    progress(st) { const nb = st.picks.filter(p => p !== undefined).length; return { answered: nb, txt: `${nb}/${o.cards.length} cartes (${this.good(st)} bien classée${this.good(st) > 1 ? 's' : ''})` }; },
    errTags: st => st.order.filter((i, k) => st.picks[k] !== undefined && st.picks[k] !== o.cards[i].bin).map(i => o.cards[i].tag),
    feats(st) { return o.badgeSecs && st.end && this.errors(st) === 0 && st.picks.length === o.cards.length && (st.end - st.start) < o.badgeSecs * 1000 ? { tri: true } : {}; },
    details(st) {
      return [{ title: o.name, items: st.order.map((i, k) => { const c = o.cards[i], p = st.picks[k];
        return { label: c.t, ok: p === c.bin, given: p ? nameOf(p) : 'sans réponse', expected: nameOf(c.bin), why: c.fb }; }) }];
    },
    view(st, n) {
      ACTIVE_TRI = { st, o, n };
      if (st.i >= o.cards.length) {
        const g = this.good(st), secs = Math.round(((st.end || Date.now()) - st.start) / 1000);
        return `<section class="panel">${stageHead(n)}
          <h2 class="h2 mt-2">${g} carte${g > 1 ? 's' : ''} bien classée${g > 1 ? 's' : ''} sur ${o.cards.length}, en ${secs} secondes</h2>
          <p class="mt-2">${o.endText || ''}</p>
          <div class="flex justify-end mt-6">${nextCtl(n)}</div></section>`;
      }
      const c = o.cards[st.order[st.i]], fb = st.fb;
      const bins = o.bins.map((b, k) => `<button class="tri-bin ${b.cls || ''} ${fb ? (b.id === c.bin ? 'ok' : (b.id === fb.pick ? 'bad' : 'fade')) : ''}" data-action="tri-bin" data-bin="${b.id}" ${fb ? 'disabled' : ''}><b>${b.name}</b><small>${b.sub}</small><span class="key">${k + 1}</span></button>`).join('');
      return `<section class="panel min-w-0" id="tri-stage">
        ${stageHead(n, `<span class="pill num" id="tri-clock">0 s</span>`)}
        <p class="small muted mt-1">${st.i === 0 && o.intro ? o.intro + ' ' : ''}Carte ${st.i + 1} sur ${o.cards.length}. Glissez la carte dans le bon bac, cliquez sur le bac ou tapez ${o.bins.map((_, k) => k + 1).join(', ')}.</p>

let triToken = 0;
function triPick(n, st, o, bin) {
  if (st.fb || st.i >= o.cards.length) return;
  const c = o.cards[st.order[st.i]], ok = bin === c.bin;
  st.picks[st.i] = bin; st.fb = { ok, pick: bin };
  checkOver(n);
  render(false);
  if (ok && !R(n).over) {
    const tok = ++triToken;
    setTimeout(() => {
      if (tok !== triToken || isPaused() || !R(n) || curStage(n).id !== o.id || !st.fb) return;
      st.fb = null; st.i++; if (st.i >= o.cards.length && !st.end) st.end = Date.now(); render(false);
    }, 900);
  }
}

// Glisser-déposer de la carte vers un bac (souris et tactile).
(function () {

    drag = { card, x: e.clientX, y: e.clientY, moved: false };
    card.setPointerCapture && card.setPointerCapture(e.pointerId);
  });
  document.addEventListener('pointermove', e => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;

    drag.card.style.transform = `translate(${dx}px, ${dy}px) rotate(${dx / 30}deg)`;
    drag.card.classList.add('dragging');
    document.querySelectorAll('.tri-bin').forEach(b => { const r = b.getBoundingClientRect(); b.classList.toggle('hover', e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom); });
  });
  document.addEventListener('pointerup', e => {
    if (!drag) return;
    const d = drag; drag = null;
    let target = null;
    document.querySelectorAll('.tri-bin').forEach(b => { const r = b.getBoundingClientRect(); if (e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom) target = b; b.classList.remove('hover'); });

const DET_TIME = 90; // secondes, indicatif (badge Œil de lynx)

function detResult(st) {
  const f = st.flags, found = DET_ERRS.filter(i => f.has(i)).length, falses = [...f].filter(i => !DET_SEGS[i].err).length;

const detStage = {
  id: 'det', name: 'Détecteur d’hallucination', quick: true,

  enter(st) { st.deadline = Date.now() + DET_TIME * 1000; },
  errors: st => st.done ? detResult(st).errors : 0,
  score: st => ({ good: st.done ? detResult(st).good : 0, total: DET_ERRS.length }),
  livePct: st => st.done ? detResult(st).good / DET_ERRS.length * 100 : 0,
  complete: st => st.done,
  summary: st => st.done ? `${detResult(st).found} / ${DET_ERRS.length}${detResult(st).falses ? ` (${detResult(st).falses} fausse${detResult(st).falses > 1 ? 's' : ''} alerte${detResult(st).falses > 1 ? 's' : ''})` : ''}` : '–',
  progress: st => ({ answered: st.done ? 1 : 0, txt: st.done ? 'validé' : `${st.flags.size} phrase(s) signalée(s), non validé` }),
  errTags: st => st.done && detResult(st).errors ? ['Hallucination'] : [],
  feats: st => { const r = st.done ? detResult(st) : null; return { lynx: !!r && r.found === DET_ERRS.length && r.falses === 0 && st.inTime }; },
  details: st => [{ title: 'Détecteur d’hallucination', items: DET_SEGS.map((sg, i) => ({ sg, i })).filter(({ sg, i }) => sg.err || st.flags.has(i)).map(({ sg, i }) => {
    const flagged = st.flags.has(i);
    return { label: `« ${sg.t} »`, ok: st.done && !!sg.err === flagged, given: !st.done ? 'sans réponse' : flagged ? 'Phrase signalée comme fausse' : 'Phrase laissée comme juste', expected: sg.err ? `Phrase fausse, à signaler (${sg.err.toLowerCase()})` : 'Phrase juste, à ne pas signaler', why: sg.err ? sg.why : 'Cette phrase est conforme à l’extrait du contrat : la signaler était une fausse alerte.' };
  }) }],
  view(st, n) {
    const done = st.done, r = done ? detResult(st) : null;

      const f = st.flags.has(i); let c = 'det-seg' + (f ? ' flagged' : '');
