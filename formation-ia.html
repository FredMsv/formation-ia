    { h: 'Calendrier après l’omnibus', t: 'Interdictions et littératie : 2 février 2025 ; transparence : 2 août 2026 ; haut risque annexe III : 2 décembre 2027 ; annexe I : 2 août 2028. Le RGPD s’applique déjà.', src: 'Séquence 07' },
    { h: 'Sanctions et rôles', t: 'Jusqu’à 35 M€ ou 7 % du CA mondial pour les pratiques interdites, 15 M€ ou 3 % pour les autres obligations. L’utilisateur d’un outil est en général « déployeur ».', src: 'Séquence 07' },
  ],
  callouts: [
    { e: 'Kit de survie', t: 'Canal validé ? Zone rouge ? Feutre noir passé ? Cinq ingrédients ? Sources à jour ? Je relis et je signe ? Une seule réponse « non » : on ne lance pas.' },
    { e: 'En conclusion', t: 'La conformité n’est pas l’ennemie de l’innovation : c’est notre plus grand bouclier. Dates et articles à confirmer avec la conformité avant chaque session.' },
  ],
};

/* =====================================================================
   APPLICATION UNIQUE — les 4 niveaux dans un seul fichier, un seul lien
   Les niveaux s'ouvrent à la suite sur ce poste. Chaque niveau validé
   donne une clé de reprise personnelle (NIV2-XXXX…), utile seulement
   pour continuer sur un autre poste ou un autre navigateur.
   ===================================================================== */
const app = $('#app');
let view = 'home';
function inLevelView() { return typeof view === 'number'; }
const isUnlocked = n => n === 1 || !!state.unlockAll || !!state.levels[n - 1].passed;
const allPassed = () => [1, 2, 3, 4].every(n => state.levels[n].passed);
function isFinalLevel() { return allPassed(); }

/* ---------- Clés de reprise (liées à l'adresse e-mail) ---------- */
function hash4(src) {
  let h = 2166136261;
  for (const ch of src) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619) >>> 0; }
  const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let out = '';
  for (let i = 0; i < 4; i++) { out += A[h % 32]; h = Math.floor(h / 32); }
  return out;
}
const unlockCode = (email, lvl) => `NIV${lvl}-${hash4(`${normEmail(email)}|${lvl}|${CODE_SECRET}`)}`;
const certCode = email => `CERT-${hash4(`${normEmail(email)}|certif|${CODE_SECRET}`)}`;
const cleanCode = s => String(s || '').toUpperCase().replace(/\s+/g, '');
// Clé à noter après la validation du niveau n (ouvre le niveau n + 1, ou le certificat).
const keyAfter = n => n < 4 ? unlockCode(state.player.email, n + 1) : certCode(state.player.email);

/* ---------- Bandeau ---------- */
let shownPts = null;
function livePts() {
  let total = 0;
  [1, 2, 3, 4].forEach(k => {
    const L = state.levels[k];
    if (typeof view === 'number' && view === k && RUN[k] && RUN[k].view === 'play') total += Math.max(L.pts || 0, Math.round(200 * MODS[k].live()));
    else total += L.pts || 0;
  });
  return total;
}
function updatePts() {
  const el = $('#pts'); if (!el) return;
  const v = livePts();
  if (shownPts !== null && v > shownPts) { el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
  shownPts = v;
  el.innerHTML = `<b class="num">${v}</b><small> / 1000 pts</small>`;
  el.hidden = !state.player.prenom;
}
setInterval(updatePts, 400);
function onProgress() {
  const passed = [1, 2, 3, 4].filter(n => state.levels[n].passed).length;
  $('#gp-label').textContent = `${passed} / 4 niveaux validés`;
  $('#gp-pct').textContent = `${passed * 25} %`;
  $('#gp').setAttribute('aria-valuenow', passed * 25);
  $('#gp-bar').innerHTML = [1, 2, 3, 4].map(n => {
    const L = state.levels[n], w = L.passed ? 100 : (isUnlocked(n) ? L.best : 0);
    return `<span class="seg ${L.passed ? 'ok' : ''}" title="Niveau ${n}"><i style="width:${w}%"></i></span>`;
  }).join('');
  const ses = currentSession();
  $('#player').innerHTML = (state.player.prenom ? `<span class="muted">Joueur :</span> <b>${esc(playerName())}</b>` : '') + (ses ? ` <span class="pill">Session ${esc(ses)}</span>` : '');
  updatePts();
}
function go(v) {
  playToken++;
  if (typeof v === 'number' && state.player.prenom) { syncGroup().then(reset => route(reset ? 'start' : v)); return; }
  route(v);
}
function route(v) {
  if (typeof view === 'number' && view !== v && state.levels[view].inProgress) sendAbandon(view, 'retour au parcours');
  if (!state.player.prenom) v = 'start';
  else if (typeof v === 'number' && !isUnlocked(v)) v = 'home';
  else if (typeof v === 'string' && v.startsWith('summary-') && !state.levels[+v.slice(8)].passed) v = 'home';
  else if (v === 'cert' && !allPassed()) v = 'home';
  view = v;
  if (typeof v === 'number') { MODS[v].start(); sendStart(v); }
  render(true);
}
function render(top) {
  const y = window.scrollY;
  if (view === 'start') app.innerHTML = StartView();
  else if (view === 'home') app.innerHTML = HomeView();
  else if (view === 'cert') app.innerHTML = CertView();
  else if (typeof view === 'string' && view.startsWith('summary-')) app.innerHTML = SummaryView(+view.slice(8));
  else app.innerHTML = `<nav class="mt-5"><button class="link" data-action="home">← Retour au parcours</button></nav>${MODS[view].view()}`;
  onProgress(); updateChrono(); if (typeof syncPauseBtn === 'function') syncPauseBtn();
  if (top) { window.scrollTo(0, 0); const h = app.querySelector('h1'); if (h) h.focus({ preventScroll: true }); }
  else window.scrollTo(0, y);
}

/* ---------- Écrans ---------- */
function StartView() {
  const mins = [1, 2, 3, 4].reduce((a, n) => a + LEVEL_META[n].mins, 0);
  return `<section class="grid gap-8 lg:grid-cols-[minmax(0,1fr)_400px] items-start mt-10">
    <div class="min-w-0">
      <p class="eyebrow">Formation IA · Bloc 1 · Socle IA</p>
      <h1 tabindex="-1" class="title mt-2">De l’utilisateur au concepteur de solutions IA</h1>
      <p class="lead mt-3">Quatre niveaux, environ ${mins} minutes : comprendre le LLM, écrire un prompt sur des données maîtrisées, construire un assistant RAG, concevoir un agent dans le cadre de l’AI Act.</p>
      <div class="grid gap-3 mt-6 sm:grid-cols-3">
        <div class="card"><p class="eyebrow grey">Pour valider</p><p class="mt-1"><b>${SEUIL}/100</b> à chaque niveau. Raté de peu ? Un rattrapage ciblé sur vos seules erreurs.</p></div>
        <div class="card"><p class="eyebrow grey">Pour jouer</p><p class="mt-1"><b>3 vies</b> par niveau, <b>${CD_MINUTES} min</b> par défi, une pause quand vous voulez.</p></div>
        <div class="card"><p class="eyebrow grey">Pour briller</p><p class="mt-1"><b>1 000 points</b>, des étoiles et des badges. Votre fiche arrive par e-mail à la fin.</p></div>
      </div>
      <div class="flex flex-wrap gap-5 mt-6">${person('sophie', 44)}${person('thomas', 44)}${person('claire', 44)}</div>
    </div>
    <div class="panel min-w-0" id="start-form">
      <h2 class="h2">Qui joue ?</h2>
      <p class="small muted mt-1">Votre nom figure sur le certificat et dans le suivi de la formation.</p>
      <div class="grid gap-4 mt-5">
        <div><label class="lbl" for="f-prenom">Prénom</label><input class="field" id="f-prenom" autocomplete="given-name" maxlength="40"></div>
        <div><label class="lbl" for="f-nom">Nom</label><input class="field" id="f-nom" autocomplete="family-name" maxlength="40"></div>
        <div><label class="lbl" for="f-email">Adresse e-mail professionnelle</label><input class="field" id="f-email" type="email" autocomplete="email" maxlength="80" spellcheck="false" placeholder="prenom.nom@${esc(DOMAINE_EMAIL || 'entreprise.fr')}"><p class="xs muted mt-1">Votre fiche de parcours y sera envoyée.</p></div>
        <details class="more"><summary>J’ai déjà commencé sur un autre poste</summary>
          <label class="lbl mt-3" for="f-code">Clé de reprise</label><input class="field mono" id="f-code" placeholder="NIV3-XXXX" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="80">
          <p class="xs muted mt-1">La clé affichée à la fin de votre dernier niveau validé. Elle ne fonctionne qu’avec votre adresse e-mail.</p></details>
        <p class="form-err" id="f-err" hidden></p>
        <button class="btn btn-primary" type="button" data-action="start-submit">Commencer le parcours</button>
      </div>
    </div>
  </section>`;
}
function levelStatus(n) {
  const L = state.levels[n];
  if (L.passed) return `<span class="pill pill-ok"><span class="dot"></span>${L.restored ? 'Validé (autre poste)' : L.rattrapage ? 'Validé après rattrapage' : 'Validé'}</span>`;
  if (!isUnlocked(n)) return '<span class="pill">Verrouillé</span>';
  return `<span class="pill pill-o"><span class="dot"></span>${L.attempts ? `${L.attempts} essai${L.attempts > 1 ? 's' : ''}` : 'Disponible'}</span>`;
}
function HomeView() {
  const passed = [1, 2, 3, 4].filter(n => state.levels[n].passed).length;
  const next = [1, 2, 3, 4].find(n => isUnlocked(n) && !state.levels[n].passed);
  const started = [1, 2, 3, 4].some(n => state.levels[n].attempts);
  const cards = [1, 2, 3, 4].map(n => {
    const M = LEVEL_META[n], st = state.levels[n], un = isUnlocked(n);
    const btns = st.passed
      ? `<button class="btn btn-ghost" data-action="open" data-n="${n}">Rejouer</button><button class="btn btn-ghost" data-action="summary" data-n="${n}">Résumé de cours</button>`
      : un ? `<button class="btn btn-primary" data-action="open" data-n="${n}">${st.attempts ? 'Reprendre' : 'Commencer'} le niveau ${n}</button>`
      : `<button class="btn btn-ghost" disabled>Validez le niveau ${n - 1}</button>`;
    return `<article class="lvl ${un ? '' : 'locked'}">
      <div class="flex items-center justify-between gap-3"><span class="num-circle ${st.passed ? 'ok' : un ? '' : 'off'}">${n}</span>${levelStatus(n)}</div>
      <div><p class="eyebrow">${M.short} · ≈ ${M.mins} min</p><h2 class="lvl-title mt-1">${M.title}</h2></div>
      <p class="small muted">${M.intro}</p>
      <div class="tagrow">${M.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
      <div class="mt-auto"><div class="flex justify-between small muted mb-1"><span>${st.passed ? starRow(st.stars || 1) + ` · ${st.pts || 0} pts` : 'Meilleur score'}</span><span class="num">${st.best} / 100</span></div><div class="bar ${st.passed ? 'ok' : ''}"><span style="width:${st.best}%"></span></div></div>
      ${st.passed ? `<p class="xs muted">Clé de reprise : <span class="mono">${keyAfter(n)}</span></p>` : ''}
      <div class="flex flex-wrap gap-2">${btns}</div>
    </article>`;
  }).join('');
  return `<section class="mt-8">
    <p class="eyebrow">Bonjour ${esc(state.player.prenom)}</p>
    <h1 tabindex="-1" class="title mt-1">Votre parcours de concepteur IA</h1>
    <p class="lead mt-2">${passed === 4 ? 'Les quatre niveaux sont validés. Votre certificat vous attend.' : `${passed} niveau${passed > 1 ? 'x' : ''} validé${passed > 1 ? 's' : ''} sur 4 · ${totalPts()} points sur 1 000. Seuil de validation : ${SEUIL}/100 à chaque niveau.`}</p>
    <div class="flex flex-wrap gap-3 mt-5">
      ${passed === 4 ? '<button class="btn btn-ok" data-action="cert">Voir mon certificat</button>' : `<button class="btn btn-primary" data-action="open" data-n="${next}">${passed || started ? `Continuer : niveau ${next}` : 'Commencer le niveau 1'}</button>`}
    </div>
  </section>
  <section class="grid gap-4 md:grid-cols-2 mt-8">${cards}</section>
  ${started && passed < 4 && ENVOI_FICHE !== 'jamais' ? `<section class="panel mt-6 flex flex-wrap items-center justify-between gap-4"><div class="min-w-0" style="flex:1 1 320px"><h2 class="h3">Vous devez vous arrêter ?</h2><p class="small muted mt-1">Recevez dès maintenant votre fiche de parcours par e-mail. Vous pourrez reprendre plus tard avec votre clé de reprise.</p></div><button class="btn btn-ghost" data-action="stop-fiche" ${state.stopSentAt && Date.now() - state.stopSentAt < 60000 ? 'disabled' : ''}>Je m’arrête ici : recevoir ma fiche</button></section>` : ''}
  ${BadgeShelf()}`;
}
function SummaryView(n) {
  const code = keyAfter(n);
  const next = n < 4
    ? `<button class="btn btn-ok" data-action="open" data-n="${n + 1}">Passer au niveau ${n + 1} : ${LEVEL_META[n + 1].title}</button>`
    : '<button class="btn btn-ok" data-action="cert">Voir mon certificat</button>';
  return `<nav class="mt-6"><button class="link" data-action="home">← Retour au parcours</button></nav>
    ${CourseSummary(n)}
    <section class="panel mt-8">
      <div class="grid gap-6 md:grid-cols-[minmax(0,1fr)_minmax(0,1fr)] items-center">
        <div class="min-w-0">
          <p class="eyebrow">${n < 4 ? `Clé de reprise · niveau ${n + 1}` : 'Code de vérification du certificat'}</p>
          <p class="mt-2">${n < 4 ? `Sur ce poste, le niveau ${n + 1} est déjà ouvert : rien à saisir. Notez cette clé si vous voulez continuer sur un autre poste ou un autre navigateur ; elle ne fonctionne qu’avec votre adresse e-mail.` : 'Ce code figure sur votre certificat et dans votre fiche de parcours.'}</p>
        </div>
        <div class="code-box"><p class="eyebrow grey">Votre clé</p><p class="code-val mt-2">${code}</p>
          <button class="btn btn-ghost mt-3" data-action="copy-code" data-code="${code}">Copier</button></div>
      </div>
    </section>
    <div class="flex flex-wrap gap-3 mt-8">${next}<button class="btn btn-ghost" data-action="home">Retour au parcours</button></div>
    <textarea id="share-fallback" class="field mt-4" readonly hidden aria-label="Texte à copier"></textarea>`;
}
function certId() { return certCode(state.player.email); }
const certDate = () => { try { return new Date(state.completedAt).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' }); } catch (e) { return ''; } };
function shareText() {
  return [`Formation IA · Bloc 1 · Socle IA`, `${playerName()} : Concepteur IA certifié`, `Score du parcours : ${totalPts()} / 1 000 points (moyenne ${avgScore()}/100)`, '',
    ...[1, 2, 3, 4].map(n => `• Niveau ${n}, ${LEVEL_META[n].title} : ${state.levels[n].best}/100 ${'★'.repeat(state.levels[n].stars || 0)}`), '', `Code de vérification ${certId()} · ${certDate()}`].join('\n');
}
function CertView() {
  return `<nav class="mt-6"><button class="link" data-action="home">← Retour au parcours</button></nav>
  <section class="mt-4 mb-6"><p class="eyebrow">Parcours terminé</p><h1 tabindex="-1" class="title mt-1">Votre certificat</h1></section>
  <section class="cert">
    <div class="relative flex flex-wrap items-start justify-between gap-6">
      <div class="min-w-0" style="flex:1 1 320px">
        <p class="eyebrow grey">Formation IA · Banque-assurance</p>
        <p class="mt-4 muted">Certifie que</p>
        <p class="mt-1" style="font-size:26px;font-weight:700">${esc(playerName())}</p>
        <p class="mt-3 muted">a validé les quatre niveaux et obtient le titre de</p>
        <p class="cert-title mt-1">Concepteur IA certifié</p>
        <p class="small muted mt-5">Délivré le ${certDate()} · Code de vérification <span class="mono">${certId()}</span></p>
      </div>
      <div class="seal"><div><b>${totalPts()}</b><span>points sur 1 000</span></div></div>
    </div>
    <div class="relative mt-8"><p class="eyebrow">Compétences acquises · moyenne ${avgScore()}/100</p>
      <div class="mt-2">${[1, 2, 3, 4].map(n => `<div class="cert-skill"><span><b>Niveau ${n}</b> · ${LEVEL_META[n].title} ${starRow(state.levels[n].stars || 0)}</span><em>${state.levels[n].best}/100</em><small>${SKILLS[n]}</small></div>`).join('')}</div>
    </div>
  </section>
  ${state.satisfaction ? '' : SatisfactionCard()}
  <section class="panel mt-6">
    <h2 class="h3">Partager mon résultat</h2>
    <p class="small muted mt-1">Votre fiche de parcours détaillée vous a été envoyée par e-mail. Copiez ici un résumé prêt à coller dans Teams ou un e-mail.</p>
    <div class="flex flex-wrap gap-3 mt-3"><button class="btn btn-primary" data-action="copy">Copier mon résultat</button><button class="btn btn-ghost" data-action="ask-reset">Rejouer le parcours</button></div>
    <textarea id="share-fallback" class="field mt-4" readonly hidden aria-label="Texte à copier"></textarea>
  </section>
  ${BadgeShelf('Vos badges')}`;
}
function copyText(txt, okMsg) {
  const fallback = () => { const t = $('#share-fallback'); if (!t) return; t.value = txt; t.hidden = false; t.focus(); t.select(); toast('Texte sélectionné', 'Copiez-le avec Ctrl+C ou ⌘+C.'); };
  try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(() => toast(okMsg, '')).catch(fallback); else fallback(); } catch (e) { fallback(); }
}

/* ---------- Réinitialisation ---------- */
function openModal() { const o = $('#overlay'); o.hidden = false; o.style.display = ''; $('#m-cancel').focus(); }
function closeModal() { const o = $('#overlay'); o.hidden = true; o.style.display = 'none'; }

/* ---------- Événements ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (!b || b.disabled) return;
  const a = b.dataset.action, d = b.dataset;
  if (typeof view === 'number' && MODS[view].handle(a, d, b)) return;
  switch (a) {
    case 'home': go('home'); break;
    case 'open': case 'retry': go(+d.n); break;
    case 'summary': go(`summary-${d.n}`); break;
    case 'cert': go('cert'); break;
    case 'copy': copyText(shareText(), 'Résultat copié'); break;
    case 'copy-code': copyText(d.code, 'Clé copiée'); break;
    case 'sat-note': satNote(+d.v); break;
    case 'sat-send': sendSatisfaction(); break;
    case 'stop-fiche': state.stopSentAt = Date.now(); saveState(); sendParcours('parcours interrompu'); toast('Fiche envoyée', `Elle arrive sur ${normEmail(state.player.email)} d’ici quelques minutes.`); render(false); break;
    case 'start-submit': submitStart(); break;
    case 'ask-reset': openModal(); break;
    case 'cancel-reset': closeModal(); break;
    case 'confirm-reset': {
      [1, 2, 3, 4].forEach(k => { if (state.levels[k].inProgress) sendAbandon(k, 'réinitialisation par l’apprenant'); });
      const keep = state.session; state = freshState(); state.session = keep; saveState();
      closeModal(); toast('Parcours réinitialisé', 'Saisissez à nouveau votre nom pour commencer.'); go('start'); break;
    }
  }
});
function restoreUpTo(k) { // niveaux 1 à k validés sur un autre poste
  for (let n = 1; n <= k; n++) {
    const L = state.levels[n]; if (L.passed) continue;
    Object.assign(L, { passed: true, restored: true, best: SEUIL, stars: 1, pts: ptsFor(SEUIL, 1) });
  }
}
function submitStart() {
  const p = $('#f-prenom').value.trim(), n = $('#f-nom').value.trim(), em = normEmail($('#f-email').value);
  const typed = cleanCode(($('#f-code') || {}).value || '');
  const err = $('#f-err');
  $('#f-prenom').classList.toggle('err', !p); $('#f-nom').classList.toggle('err', !n);
  if (!p || !n) { err.textContent = 'Renseignez votre prénom et votre nom pour commencer.'; err.hidden = false; return; }
  const emErr = emailError(em);
  $('#f-email').classList.toggle('err', !!emErr);
  if (emErr) { err.textContent = emErr; err.hidden = false; return; }
  let restore = 0, trainer = false;
  if (typed) {
    if (typed === cleanCode(CODE_FORMATEUR)) trainer = true;
    else if (typed === cleanCode(certCode(em))) restore = 4;
    else { const k = [2, 3, 4].find(x => typed === cleanCode(unlockCode(em, x))); if (k) restore = k - 1; }
    if (!trainer && !restore) { $('#f-code').classList.add('err'); err.textContent = `Clé de reprise incorrecte pour ${em}. Vérifiez la clé et l’adresse e-mail utilisée sur l’autre poste.`; err.hidden = false; return; }
  }
  if (normEmail(state.player.email) && em !== normEmail(state.player.email)) { const keep = state.session; state = freshState(); state.session = keep; }
  state.player = { prenom: p, nom: n, email: em };
  if (trainer) { state.unlockAll = true; toast('Mode formateur', 'Tous les niveaux sont ouverts sur ce poste.'); }
  if (restore) { restoreUpTo(restore); if (restore === 4 && !state.completedAt) { state.completedAt = new Date().toISOString(); state.ficheSent = true; } toast('Parcours repris', `Niveau${restore > 1 ? 'x' : ''} 1${restore > 1 ? ` à ${restore}` : ''} validé${restore > 1 ? 's' : ''} sur un autre poste.`); }
  saveState(); go('home');
}
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.closest && e.target.closest('#start-form')) { e.preventDefault(); submitStart(); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#overlay').hidden) closeModal(); });
$('#overlay').addEventListener('click', e => { if (e.target.id === 'overlay') closeModal(); });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || typeof view === 'number') return;
  syncGroup().then(reset => { if (reset) route('start'); });
});
app.innerHTML = loadingView();
syncGroup().then(() => route(state.player.prenom ? 'home' : 'start'));

</script>
