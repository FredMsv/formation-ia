<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Niveau 1 · Démystifier l’IA générative</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { corePlugins: { preflight: false } };</script>
<style>
/* Layout : colonne de 1080px sous un bandeau blanc ; cartes grises plates, bandeaux orange et encadrés pêche repris du support de formation */
:root{
  --orange:#EA6827; --orange-2:#ED7D31; --orange-deep:#C4501A; --peach:#FDEEE3; --peach-2:#FBE3D2;
  --card:#F3F3F3; --ink:#333333; --ink-2:#404040; --muted:#666666; --line:#E2E2E2; --white:#FFFFFF;
  --ok:#2C7A4B; --ok-soft:#E3F2E8; --bad:#B3261E; --bad-soft:#FBE5E3;
  --console:#2F2F2F; --console-ink:#EDEDED; --console-dim:#A8A8A8;
  --c-thought:#FFB98A; --c-action:#FFD66B; --c-obs:#A9D1FF; --c-ok:#8FE0B0; --c-err:#FF9C92; --c-warn:#FFCB7A;
  --f:"Calibri","Carlito","Segoe UI",Candara,"Helvetica Neue",Arial,sans-serif;
  --mono:"Consolas","Cascadia Mono","SFMono-Regular",Menlo,"Courier New",monospace;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--white);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p,ul,ol,figure{margin:0}
ul,ol{padding:0;list-style:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
:focus-visible{outline:2px solid var(--orange-deep);outline-offset:2px;border-radius:4px}
[tabindex="-1"]:focus{outline:none}
.wrap{max-width:1080px;margin-inline:auto;padding-inline:16px}
@media (min-width:640px){.wrap{padding-inline:28px}}
main.wrap{padding-block:8px 72px}

/* Typographie (Calibri, comme le support) */
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--orange-deep);font-weight:700}
.eyebrow.grey{color:var(--muted)}
.title{font-size:clamp(26px,3.6vw,34px);font-weight:400;line-height:1.18;color:var(--ink);text-wrap:balance;letter-spacing:-.005em}
.h2{font-size:22px;font-weight:400;line-height:1.25;text-wrap:balance}
.h3{font-size:17px;font-weight:700;line-height:1.35}
.lead{font-size:17px;color:var(--ink-2);max-width:68ch}
.muted{color:var(--muted)}
.small{font-size:14px}
.xs{font-size:12.5px}
.mono{font-family:var(--mono)}
.num{font-variant-numeric:tabular-nums}
.prose{max-width:70ch}

/* Bandeau supérieur */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--white);border-bottom:1px solid var(--line)}
.topbar-in{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.brand b{display:block;font-size:15px;line-height:1.15}
.brand small{display:block;font-size:12px;color:var(--muted)}
.gp{flex:1 1 240px;min-width:0}
.gp-top{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--muted);margin-bottom:5px}
.gp-top strong{color:var(--ink)}
.gp-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.seg{height:8px;border-radius:99px;background:var(--card);overflow:hidden;display:block}
.seg i{display:block;height:100%;width:0;background:var(--orange-2);border-radius:inherit;transition:width .6s ease}
.seg.ok i{background:var(--ok)}
.player{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-2)}
.btn-top{border:1px solid var(--line);padding:6px 12px;border-radius:6px;font-size:13.5px;color:var(--ink-2);background:var(--white)}
.btn-top:hover{border-color:var(--orange)}

/* Surfaces reprises du support */
.card{background:var(--card);border-radius:6px;padding:18px 20px}
.panel{background:var(--white);border:1px solid var(--line);border-radius:8px;padding:20px}
@media (min-width:640px){.panel{padding:26px}}
.banner{background:var(--orange);color:#fff;border-radius:6px;padding:14px 18px;font-size:16.5px}
.banner b{font-weight:700}
.callout{background:var(--peach);border-radius:6px;padding:14px 18px}
.callout .eyebrow{display:block;margin-bottom:4px}
.divider{height:1px;background:var(--line);border:0;margin:0}
.num-circle{width:34px;height:34px;border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center;font-weight:700;flex:none;font-variant-numeric:tabular-nums}
.num-circle.sm{width:26px;height:26px;font-size:13px}
.num-circle.off{background:var(--line);color:var(--muted)}
.num-circle.ok{background:var(--ok)}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:6px;padding:10px 18px;font-weight:700;font-size:15px;border:1px solid transparent;line-height:1.3;transition:background .15s,border-color .15s,transform .1s}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn-primary{background:var(--orange-deep);color:#fff}
.btn-primary:hover:not(:disabled){background:#A9440F}
.btn-ok{background:var(--ok);color:#fff}
.btn-ok:hover:not(:disabled){background:#21603A}
.btn-ghost{background:var(--white);border-color:#CFCFCF;color:var(--ink)}
.btn-ghost:hover:not(:disabled){border-color:var(--orange)}
.btn-danger{background:var(--bad);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{color:var(--orange-deep);font-weight:700;font-size:14.5px}
.link:hover{text-decoration:underline}

/* Pastilles */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--card);color:var(--ink-2);line-height:1.5}
.pill-o{background:var(--peach-2);color:var(--orange-deep)}
.pill-ok{background:var(--ok-soft);color:var(--ok)}
.pill-bad{background:var(--bad-soft);color:var(--bad)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}

/* Jauges */
.bar{height:8px;background:var(--card);border-radius:99px;overflow:hidden}
.bar>span{display:block;height:100%;background:var(--orange-2);border-radius:inherit;transition:width .6s ease}
.bar.ok>span{background:var(--ok)}
.gauge{position:relative;height:14px;background:var(--card);border-radius:99px;margin-top:28px}
.gauge-fill{height:100%;border-radius:inherit;background:var(--bad);transition:width .9s cubic-bezier(.2,.8,.2,1)}
.gauge-fill.ok{background:var(--ok)}
.gauge-mark{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--ink)}
.gauge-mark span{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:11.5px;font-weight:700;color:var(--muted);white-space:nowrap;padding-bottom:2px}
.score-big{font-weight:700;font-size:54px;line-height:1;font-variant-numeric:tabular-nums}

/* Options de réponse */
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--white);border:1px solid #D6D6D6;border-radius:6px;padding:12px 14px;transition:border-color .15s,background .15s;line-height:1.5}
.opt:hover:not(:disabled){border-color:var(--orange)}
.opt:disabled{cursor:default}
.opt.sel,.opt[aria-pressed="true"]{border-color:var(--orange);background:var(--peach);box-shadow:inset 0 0 0 1px var(--orange)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft);box-shadow:inset 0 0 0 1px var(--ok)}
.opt.ok-reveal{border-color:var(--ok);border-style:dashed}
.opt.bad{border-color:var(--bad);background:var(--bad-soft);box-shadow:inset 0 0 0 1px var(--bad)}
.opt.fade{opacity:.6}
.key{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--card);color:var(--ink-2)}
.opt.sel .key,.opt[aria-pressed="true"] .key{background:var(--orange);color:#fff}
.opt.ok .key{background:var(--ok);color:#fff}
.opt.bad .key{background:var(--bad);color:#fff}
.check{flex:none;width:20px;height:20px;border-radius:4px;border:1.5px solid #8A8A8A;display:grid;place-items:center;margin-top:2px;font-size:13px;line-height:1;background:var(--white)}
.opt[aria-pressed="true"] .check{background:var(--orange);border-color:var(--orange);color:#fff}
.opt-body{min-width:0;flex:1}
.opt-fb{margin-top:8px;font-size:14.5px;color:var(--ink)}

/* Feedback */
.fb{border-radius:6px;padding:14px 18px;background:var(--card)}
.fb-ok{background:var(--ok-soft)}
.fb-bad{background:var(--bad-soft)}
.fb-head{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:4px}
.fb-ok .fb-head{color:var(--ok)}
.fb-bad .fb-head{color:var(--bad)}

/* Zones de code */
.prompt-box{background:var(--card);border-radius:6px;padding:14px 16px;font-family:var(--mono);font-size:13.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word;color:var(--ink)}
.prompt-box .pk{color:var(--orange-deep);font-weight:700}
.prompt-box .pe{color:var(--muted);font-style:italic}
.console{background:var(--console);color:var(--console-ink);border-radius:6px;padding:14px 16px;font-family:var(--mono);font-size:13px;line-height:1.55;max-height:470px;min-height:140px;overflow:auto}
.ln{display:grid;grid-template-columns:120px minmax(0,1fr);gap:10px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.07);animation:lnIn .25s ease both}
.ln:last-child{border-bottom:0}
.ln .lt{font-weight:700;white-space:nowrap}
.ln-thought .lt{color:var(--c-thought)} .ln-action .lt{color:var(--c-action)} .ln-obs .lt{color:var(--c-obs)}
.ln-ok .lt,.ln-final .lt{color:var(--c-ok)} .ln-err .lt{color:var(--c-err)} .ln-warn .lt{color:var(--c-warn)} .ln-info .lt{color:var(--console-dim)}
.ln-err .lx{color:var(--c-err)} .ln-final .lx{color:var(--c-ok)} .ln-action .lx{color:#FFF0C7}
.ln .it{color:var(--console-dim);font-weight:400}
.ln-idle{color:var(--console-dim)}
@keyframes lnIn{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
@media (max-width:540px){.ln{grid-template-columns:minmax(0,1fr);gap:0}}

/* Feutre noir (N2) */
.redact-text{background:var(--card);border-radius:6px;padding:18px 20px;line-height:2.25;font-size:16px}
.rs{display:inline;border-radius:4px;padding:3px 6px;border:1.5px dashed #9A9A9A;background:var(--white);cursor:pointer;line-height:1.4;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.rs:hover:not(:disabled){border-color:var(--orange)}
.rs.on{background:#1F1F1F;color:#fff;border-style:solid;border-color:#1F1F1F}
.rs.good{outline:2px solid var(--ok);outline-offset:1px}
.rs.wrong{outline:2px solid var(--bad);outline-offset:1px}
.rs:disabled{cursor:default}

/* Pipeline (N3) */
.pipe{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.chip{font-size:13px;font-weight:700;padding:5px 10px;border-radius:6px;background:var(--card);color:var(--muted);border:1px solid transparent;transition:all .2s}
.chip.on{background:var(--peach);color:var(--orange-deep);border-color:var(--orange)}
.chip.done{background:var(--ok-soft);color:var(--ok)}
.chip.fail{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.arrow{color:var(--muted);font-size:12px}
.order-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:6px;background:var(--card);border:1px solid transparent;transition:box-shadow .15s,background .15s}
.order-row.draggable{cursor:grab;user-select:none;-webkit-user-select:none}
.order-row.draggable:hover{border-color:#D6D6D6}
.order-row.dragging{cursor:grabbing;background:var(--peach);border-color:var(--orange);box-shadow:0 10px 24px rgba(0,0,0,.15);position:relative;z-index:2}
.grip{flex:none;width:30px;height:40px;display:grid;place-items:center;color:var(--muted);font-size:18px;letter-spacing:-3px;touch-action:none;border-radius:6px}
.order-row.draggable:hover .grip{color:var(--orange-deep)}
.order-row .num-circle{background:var(--white);color:var(--ink);border:1px solid var(--line)}
.order-row.good .num-circle{background:var(--ok);color:#fff;border-color:var(--ok)}
.order-row.wrong .num-circle{background:var(--bad);color:#fff;border-color:var(--bad)}
.mv{width:34px;height:34px;border-radius:6px;border:1px solid #CFCFCF;display:grid;place-items:center;color:var(--ink-2);font-size:15px;background:var(--white)}
.mv:hover:not(:disabled){border-color:var(--orange);color:var(--orange-deep)}
.mv:disabled{opacity:.3;cursor:not-allowed}

/* Outils (N4) */
.tool{display:flex;flex-direction:column;gap:4px;text-align:left;border:1px solid #D6D6D6;border-radius:6px;padding:12px 14px;background:var(--white);min-width:0;transition:border-color .15s,background .15s}
.tool:hover:not(:disabled){border-color:var(--orange)}
.tool[aria-pressed="true"]{border-color:var(--orange);background:var(--peach);box-shadow:inset 0 0 0 1px var(--orange)}
.tool code{font-family:var(--mono);font-size:12.5px;color:var(--muted);word-break:break-all}
.tool .tname{font-weight:700;font-size:15px;display:flex;justify-content:space-between;gap:8px}
.sw{flex:none;width:32px;height:19px;border-radius:99px;background:var(--line);position:relative}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:var(--white);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .15s}
.tool[aria-pressed="true"] .sw{background:var(--orange)}
.tool[aria-pressed="true"] .sw::after{left:15px}
.segd{display:flex;flex-wrap:wrap;gap:6px}
.segd button{font-size:13.5px;font-weight:700;padding:6px 10px;border-radius:6px;border:1px solid #CFCFCF;background:var(--white)}
.segd button[aria-pressed="true"]{background:var(--orange);border-color:var(--orange);color:#fff}
.segd button.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.segd button.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.segd button.ok-reveal{border:2px dashed var(--ok)}
.review{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;padding:9px 0;border-bottom:1px solid var(--line)}
.review:last-child{border-bottom:0}
.mark{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;margin-top:1px;color:#fff}
.mark.y{background:var(--ok)} .mark.n{background:var(--bad)}

/* Quiz */
.qdots{display:flex;gap:4px;flex-wrap:wrap}
.qdot{width:22px;height:6px;border-radius:99px;background:var(--line)}
.qdot.cur{background:var(--orange)} .qdot.y{background:var(--ok)} .qdot.n{background:var(--bad)}

/* Personnages */
.person{display:flex;align-items:center;gap:12px}
.person svg{flex:none;border-radius:50%}
.person b{display:block;font-size:15px;line-height:1.2}
.person span{display:block;font-size:13px;color:var(--muted)}

/* Niveaux (accueil) */
.lvl{display:flex;flex-direction:column;gap:14px;background:var(--white);border:1px solid var(--line);border-radius:8px;padding:22px;min-width:0}
.lvl.locked{background:var(--card);border-color:transparent}
.lvl.locked .lvl-title{color:var(--muted)}
.lvl-title{font-size:21px;line-height:1.2;text-wrap:balance}
.tagrow{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12.5px;padding:2px 9px;border-radius:99px;background:var(--card);color:var(--ink-2)}
.lvl.locked .tag{background:var(--white)}

/* Résumé de cours */
.sum-grid{display:grid;gap:14px}
@media (min-width:720px){.sum-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1000px){.sum-grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}}
.sum-card{background:var(--card);border-radius:6px;padding:18px 20px;display:flex;gap:14px;align-items:flex-start;min-width:0}
.sum-card h3{font-size:16.5px;font-weight:700;line-height:1.3}
.sum-card p{font-size:14.5px;margin-top:4px;color:var(--ink-2)}
.sum-card .src{display:block;margin-top:8px;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--orange-deep);font-weight:700}

/* Code de passage & certificat */
.code-box{background:var(--peach);border:2px dashed var(--orange);border-radius:8px;padding:20px;text-align:center}
.code-val{font-family:var(--mono);font-size:clamp(26px,5vw,38px);font-weight:700;letter-spacing:.08em;color:var(--orange-deep);word-break:break-all}
.cert{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:28px 22px;position:relative;overflow:hidden}
@media (min-width:640px){.cert{padding:44px 48px}}
.cert::before{content:"";position:absolute;inset:10px;border:1.5px solid var(--peach-2);border-radius:6px;pointer-events:none}
.cert-title{font-size:clamp(30px,5vw,44px);line-height:1.05;color:var(--orange-deep);font-weight:700}
.seal{width:116px;height:116px;border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center;text-align:center;flex:none;box-shadow:0 0 0 6px var(--peach),0 0 0 8px var(--orange-2)}
.seal b{font-size:36px;line-height:1;display:block;font-variant-numeric:tabular-nums}
.seal span{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase}
.cert-skill{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 16px;padding:10px 0;border-top:1px solid var(--line)}
.cert-skill em{font-style:normal;font-variant-numeric:tabular-nums;color:var(--ok);font-weight:700}
.cert-skill small{grid-column:1/-1;color:var(--muted);font-size:13.5px}

/* Formulaires */
.field{width:100%;border:1px solid #CFCFCF;border-radius:6px;padding:10px 12px;background:var(--white);color:var(--ink)}
.field:focus{outline:2px solid var(--orange);outline-offset:0;border-color:transparent}
.field.err{border-color:var(--bad);background:var(--bad-soft)}
label.lbl{display:block;font-weight:700;font-size:14.5px;margin-bottom:6px}
textarea.field{font-family:var(--mono);font-size:13px;min-height:190px;resize:vertical}
.form-err{color:var(--bad);font-weight:700;font-size:14.5px}

/* Fenêtre et notifications */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(30,30,30,.5);display:grid;place-items:center;padding:16px}
.modal{background:var(--white);border-radius:10px;padding:24px;max-width:450px;width:100%;box-shadow:0 24px 60px rgba(0,0,0,.25)}
.toast{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:#fff;border-radius:8px;padding:12px 16px;display:flex;gap:12px;align-items:center;max-width:min(380px,calc(100vw - 32px));box-shadow:0 14px 40px rgba(0,0,0,.25);animation:toastIn .3s ease both}
.toast small{color:#D0D0D0;display:block;font-size:13px}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.sticky-col{position:sticky;top:calc(env(safe-area-inset-top,0px) + 96px)}
@media (max-width:1023px){.sticky-col{position:static}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* Question de satisfaction */
.sat-scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.sat-btn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border:1px solid #CFCFCF;border-radius:8px;background:var(--white);cursor:pointer;min-height:64px}
.sat-btn b{font-size:22px;line-height:1}
.sat-btn small{font-size:11px;color:#666;text-align:center;line-height:1.2}
.sat-btn:hover{border-color:var(--orange)}
.sat-btn.on{background:var(--orange-deep);border-color:var(--orange-deep);color:#fff}
.sat-btn.on small{color:#fff}
textarea.field.sat-comment{font-family:inherit;font-size:14px;min-height:72px}
@media (max-width:520px){.sat-btn small{display:none}}

/* Vrai ou faux éclair */
.tf-card{border:2px solid var(--orange);border-radius:12px;background:var(--peach);padding:28px 24px;min-height:120px;display:flex;align-items:center;justify-content:center;text-align:center;transition:background .2s,border-color .2s}
.tf-card p{font-size:21px;line-height:1.45;font-weight:600;margin:0;max-width:720px}
.tf-card.is-ok{border-color:var(--ok);background:var(--ok-soft)}
.tf-card.is-bad{border-color:var(--bad);background:var(--bad-soft)}
.tf-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tf-btn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:18px 10px;border-radius:10px;border:2px solid #CFCFCF;background:var(--white);cursor:pointer;transition:transform .1s,border-color .15s,background .15s}

<body>
<header class="topbar">
  <div class="wrap topbar-in">
    <div class="brand"><span class="logo" aria-hidden="true">IA</span><span><b>Formation IA</b><small>Niveau 1 sur 4 · Démystifier l’IA générative · v2026-10-06.2</small></span></div>
    <div class="gp" id="gp" role="progressbar" aria-label="Progression" aria-valuemin="0" aria-valuemax="100">

      <button class="btn btn-danger" data-action="confirm-reset">Tout effacer</button>
    </div>
  </div>
</div>
<div id="toast-host" aria-live="polite"></div>
<script>
/* =====================================================================
   CONFIGURATION — À MODIFIER
   ===================================================================== */
// URL du webhook (Make, Zapier…). Le jeu envoie une ligne quand un niveau est
// commencé, une ligne quand il est terminé et une ligne s'il est abandonné. Champs : horodatage, evenement, session,
// version, prenom, nom, joueur, niveau, titre_niveau, niveau_valide, score, seuil,
// tentative, erreurs_tentative, erreurs_frequentes, email, duree_secondes, avancement,
// note_satisfaction, commentaire_satisfaction (événement « satisfaction », fin du niveau 4),
// puis envoyer_fiche, fiche_sujet, fiche_html, fiche_taille (pour l'e-mail, à ne pas mettre dans la feuille).
// La session vient du lien envoyé aux apprenants : niveau-1.html?session=Groupe-A
const WEBHOOK_URL = "https://hook.eu2.make.com/nfuswd0gqqz4kv7vrs2lid42tnilpf4v";

// Identifiant de la petite Google Sheet « Config Formation IA » (partagée en lecture par lien).
// C'est la partie de son adresse entre /d/ et /edit. Elle contient le groupe actif en Config!A2.
const CONFIG_SHEET_ID = "1-v3PQq4ukj73AeewDwqHIKomZx3ESaBKMBarJJq83nc";

// Seuil de validation d'un niveau, en pourcentage.
const SEUIL = 90;

// Seules les adresses de ce domaine peuvent jouer. Mettez "" pour accepter toute adresse (tests externes).
const DOMAINE_EMAIL = "lendys.fr";

// Envoi de la fiche de score par e-mail : "validation" (niveau validé uniquement),
// "toujours" (chaque niveau terminé, validé ou non) ou "jamais".
const ENVOI_FICHE = "validation";

// Sel des codes de passage : il doit être IDENTIQUE dans les 4 fichiers de la version B.
// Changez-le avant diffusion pour que vos codes ne soient pas devinables.
const CODE_SECRET = "Lendys_AI2026";

// Code formateur : ouvre n'importe quel niveau, pour les tests et le support. À garder confidentiel.
const CODE_FORMATEUR = "Lendys_FormateurAI2026";

// Numéro du niveau contenu dans ce fichier (ne pas modifier).
const LEVEL = 1;
const STORAGE_KEY = "formation-ia-parcours-B";
const VERSION_LABEL = "B - fichier niveau 1 · v2026-10-06.2";

/* =====================================================================
   NOYAU COMMUN : outils, état, suivi webhook, personnages, composants
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const shuffle = a => { const b = [...a]; for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
const reduceMotion = () => !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

/* ---------- Métadonnées des niveaux ---------- */
const LEVEL_META = {
  1: { title: 'Démystifier l’IA générative', short: 'Fondations', format: 'Vrai ou faux + quiz de 10 situations', rule: 'score ≥ 90/100', src: 'Modules 1, 3 et 4 du support',
       intro: 'Un LLM ne comprend pas : il prédit le mot suivant. Dix situations tirées de nos métiers pour maîtriser tokens, probabilités, température, hallucinations et limites d’usage.',
       tags: ['Tokens', 'Probabilités', 'Température', 'Hallucinations', 'Feutre noir', 'Zones rouges'] },
  2: { title: 'Prompt engineering avancé', short: 'L’artisan', format: 'Vrai ou faux + atelier « Répare le prompt »', rule: 'robustesse ≥ 90/100', src: 'Modules 2 et 3 du support',
       intro: 'Le fil rouge : la réponse au sociétaire furieux après un refus d’indemnisation. Diagnostiquez le prompt, passez le feutre noir, puis reconstruisez-le avec les cinq ingrédients.',
       tags: ['Rôle', 'Contexte', 'Tâche', 'Contraintes', 'Format', 'Anonymisation'] },
  3: { title: 'RAG et gestion du contexte', short: 'L’architecte de données', format: 'Vrai ou faux + assemblage du pipeline RAG', rule: 'pipeline sans fuite ni hallucination, ≥ 90/100', src: 'Modules 4 et 5 du support',
       intro: 'Construisez l’assistant documentaire qui répond « à livre ouvert » sur les conditions générales, sans tomber dans le grenier poussiéreux ni percer les droits d’accès.',
       tags: ['Découpage', 'Embeddings', 'Recherche par le sens', 'Millésimes', 'Droits d’accès'] },
  4: { title: 'Conception d’agents IA', short: 'Le concepteur', format: 'Vrai ou faux + simulateur ReAct et AI Act', rule: 'mission sans boucle ni débordement, ≥ 90/100', src: 'Modules 4, 5 et 6 du support, appliqués aux agents',
       intro: 'Équipez un agent de traitement des réclamations : outils au moindre privilège, garde-fous, validation humaine. Puis classez des usages selon l’AI Act.',
       tags: ['ReAct', 'Outils', 'Moindre privilège', 'Garde-fous', 'Contrôle humain', 'AI Act'] },
};
const SKILLS = {
  1: 'Expliquer qu’un LLM prédit des tokens, régler la température selon l’enjeu, repérer une hallucination et respecter zones rouges et feutre noir',
  2: 'Écrire un prompt métier complet (rôle, contexte, tâche, contraintes, format) à partir de données anonymisées',
  3: 'Concevoir un assistant RAG fiable : sources datées, recherche par le sens filtrée par habilitation, réponses sourcées',
  4: 'Spécifier un agent ReAct au moindre privilège, avec garde-fous, validation humaine et lecture AI Act des usages',
};

/* ---------- État et sauvegarde ---------- */
const lvState = () => ({ best: 0, passed: false, attempts: 0, errors: {} });
function freshState() { return { player: { prenom: '', nom: '', email: '' }, levels: { 1: lvState(), 2: lvState(), 3: lvState(), 4: lvState() }, gates: {}, completedAt: null, session: '' }; }
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const s = JSON.parse(raw), b = freshState();
      b.player = Object.assign(b.player, s.player || {});
      for (const n of [1, 2, 3, 4]) { b.levels[n] = Object.assign(lvState(), (s.levels || {})[n] || {}); b.levels[n].errors = b.levels[n].errors || {}; }
      b.gates = s.gates || {};
      b.completedAt = s.completedAt || null;
      b.satisfaction = s.satisfaction || null;
      b.session = typeof s.session === 'string' ? s.session : '';
      return b;
    }
  } catch (e) {}
  return freshState();
}
function saveState() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {} }
let state = loadState();
const playerName = () => `${state.player.prenom} ${state.player.nom}`.trim();
const normEmail = s => String(s || '').trim().toLowerCase();
// Renvoie un message d'erreur, ou '' si l'adresse est acceptée.
function emailError(e) {
  const v = normEmail(e);
  if (!v) return 'Renseignez votre adresse e-mail professionnelle.';
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) return 'Cette adresse e-mail n’est pas valide.';
  if (DOMAINE_EMAIL && !v.endsWith('@' + DOMAINE_EMAIL.toLowerCase())) return `Ce jeu est réservé aux adresses @${DOMAINE_EMAIL}. Utilisez votre adresse professionnelle.`;
  return '';
}

/* ---------- Suivi administrateur (webhook Make / Zapier) ---------- */
function topErrors(n, k = 3) {
  return Object.entries(state.levels[n].errors).sort((a, b) => b[1] - a[1]).slice(0, k).map(([t, c]) => `${t} (${c})`).join(' ; ');
}
/* =====================================================================
   GROUPE ACTIF (session)
   Le formateur active un groupe depuis la page formateur (index.html).
   Make l'écrit dans la cellule A2 de l'onglet « Config » d'une petite
   Google Sheet partagée en lecture ; chaque niveau la lit à l'ouverture.
   Un lien ?session=… reste possible et passe avant la feuille.
   Si le groupe change, le poste est remis à zéro (nouvel apprenant).
   ===================================================================== */
const cleanGroup = s => String(s || '').trim().replace(/[<>"]/g, '').slice(0, 60);
function readSessionFromLink() {
  try { return cleanGroup(new URLSearchParams(window.location.search).get('session') || ''); } catch (e) { return ''; }
}
async function fetchActiveGroup() {
  if (!CONFIG_SHEET_ID || CONFIG_SHEET_ID === 'ID_A_REMPLACER') return null;
  const url = `https://docs.google.com/spreadsheets/d/${encodeURIComponent(CONFIG_SHEET_ID)}/gviz/tq?tqx=out:csv&sheet=Config&range=A2&headers=0&t=${Date.now()}`;
  try {
    const ctrl = new AbortController(); const timer = setTimeout(() => ctrl.abort(), 3000);
    const r = await fetch(url, { cache: 'no-store', signal: ctrl.signal });
    clearTimeout(timer);
    if (!r.ok) return null;
    const txt = (await r.text()).trim();
    if (!txt || txt.startsWith('<')) return null;
    const first = txt.split(/\r?\n/)[0].replace(/^"|"$/g, '').replace(/""/g, '"');
    return cleanGroup(first) || null;
  } catch (e) { return null; }
}
function currentSession() { return readSessionFromLink() || state.session || ''; }
// Renvoie true si le poste a été remis à zéro parce que le groupe a changé.
function applyGroup(fromSheet) {
  const target = readSessionFromLink() || fromSheet || '';
  if (!target) return false;
  if (state.session && state.session !== target) {
    [1, 2, 3, 4].forEach(n => { if (state.levels[n].inProgress) sendAbandon(n, 'changement de groupe', true); });
    state = freshState(); state.session = target; saveState();
    toast(`Nouveau groupe : ${target}`, 'Ce poste a été remis à zéro. Saisissez votre prénom et votre nom.');
    return true;
  }
  if (!state.session) { state.session = target; saveState(); }
  return false;
}
async function syncGroup() { return applyGroup(await fetchActiveGroup()); }
const loadingView = () => '<section class="mt-16 text-center"><p class="eyebrow">Formation IA</p><p class="h2 mt-2">Chargement du groupe en cours…</p></section>';
function postWebhook(payload) {
  if (!WEBHOOK_URL || WEBHOOK_URL === 'URL_A_REMPLACER') { console.info('[Suivi] WEBHOOK_URL non configurée. Données qui auraient été envoyées :', payload); return; }
  try {
    // Format formulaire + mode no-cors : accepté par Make et Zapier sans pré-requête CORS.
    const body = new URLSearchParams(payload);
    // keepalive est limité à 64 Ko : on ne l'active que pour les petits envois.
    fetch(WEBHOOK_URL, { method: 'POST', mode: 'no-cors', keepalive: body.toString().length < 60000, body })
      .catch(err => console.warn('[Suivi] Envoi impossible :', err));
  } catch (err) { console.warn('[Suivi] Envoi impossible :', err); }
}
function basePayload(n, evenement) {
  return {
    horodatage: new Date().toISOString(),
    evenement,
    session: currentSession() || 'non renseignée',
    version: VERSION_LABEL,
    prenom: state.player.prenom,
    nom: state.player.nom,
    joueur: playerName(),
    niveau: String(n),
    titre_niveau: LEVEL_META[n].title,
  };
}
const levelStart = {};
// Envoyé à l'ouverture d'un niveau (et à chaque nouvelle tentative).
let chrono = { n: null, start: 0, end: 0 };
function sendStart(n) {
  // Une tentative précédente restée ouverte (page fermée sans signal) est d'abord déclarée abandonnée.
  if (state.levels[n].inProgress) sendAbandon(n, 'page fermée ou rechargée en cours de partie', true);
  levelStart[n] = Date.now();
  chrono = { n, start: levelStart[n], end: 0 };
  state.levels[n].inProgress = { start: levelStart[n] };
  saveState();
  updateChrono();
  postWebhook(Object.assign(basePayload(n, 'niveau commencé'), {
    niveau_valide: '', score: '', seuil: String(SEUIL),
    tentative: String(state.levels[n].attempts + 1),
    erreurs_tentative: '', erreurs_frequentes: topErrors(n) || 'aucune',
    email: normEmail(state.player.email), duree_secondes: '', avancement: '',
    envoyer_fiche: 'non', fiche_sujet: '', fiche_html: '', fiche_taille: '0',
  }));
}
/* Abandon : réinitialisation, page fermée ou rechargée, retour au parcours, changement de groupe.
   Une tentative abandonnée après au moins une réponse compte comme une tentative. */
function sendAbandon(n, raison, sansDetail) {
  const L = state.levels[n], ip = L.inProgress;
  if (!ip) return;
  // sansDetail : la partie n'est plus à l'écran ; on reprend l'avancement mémorisé à la fermeture de la page.
  let prog = ip.snapshot || { answered: 0, txt: 'avancement inconnu' };
  if (!sansDetail && MODS[n] && MODS[n].progress) { try { prog = MODS[n].progress(); } catch (e) {} }
  if (prog.answered > 0) L.attempts += 1;
  const fin = sansDetail && ip.snapshot ? ip.snapshot.at : Date.now();
  const duree = Math.round((fin - ip.start) / 1000);
  delete L.inProgress;
  saveState();
  if (chrono.n === n) chrono = { n: null, start: 0, end: 0 };
  postWebhook(Object.assign(basePayload(n, 'niveau abandonné'), {
    niveau_valide: '', score: '', seuil: String(SEUIL),
    tentative: String(prog.answered > 0 ? L.attempts : L.attempts + 1),
    erreurs_tentative: '', erreurs_frequentes: topErrors(n) || 'aucune',
    email: normEmail(state.player.email), duree_secondes: String(duree),
    avancement: `${raison} · ${prog.txt}`,
    envoyer_fiche: 'non', fiche_sujet: '', fiche_html: '', fiche_taille: '0',
  }));
}
/* Fermeture ou rechargement de la page en pleine partie : un envoi réseau à ce moment-là n'est pas fiable.
   On mémorise l'avancement sur le poste ; l'abandon est envoyé à la prochaine ouverture d'un niveau
   (rechargement, apprenant suivant, changement de groupe). */
window.addEventListener('pagehide', () => {
  let changed = false;
  [1, 2, 3, 4].forEach(n => {
    const ip = state.levels[n] && state.levels[n].inProgress;
    if (!ip) return;
    let prog = { answered: 0, txt: 'avancement inconnu' };
    if (MODS[n] && MODS[n].progress) { try { prog = MODS[n].progress(); } catch (e) {} }
    ip.snapshot = Object.assign(prog, { at: Date.now() }); changed = true;
  });
  if (changed) saveState();
});
/* Chronomètre affiché dans le bandeau pendant la partie. */
const fmtDur = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
function updateChrono() {
  const el = document.getElementById('chrono'); if (!el) return;
  const show = !!chrono.n && typeof inLevelView === 'function' && inLevelView();
  el.hidden = !show; if (!show) return;
  const s = Math.max(0, Math.round(((chrono.end || Date.now()) - chrono.start) / 1000));
  el.textContent = `${chrono.end ? 'Durée' : 'Temps'} ${fmtDur(s)}`;
  el.classList.toggle('pill-ok', !!chrono.end);
}
setInterval(updateChrono, 1000);
// Envoyé à la fin d'un niveau, qu'il soit validé ou non. Contient la fiche de score à envoyer par e-mail.
function sendTracking(n, pct, passed, errs) {
  if (chrono.n === n) chrono.end = Date.now();
  const duree = levelStart[n] ? Math.round((Date.now() - levelStart[n]) / 1000) : '';
  const envoyer = ENVOI_FICHE === 'toujours' || (ENVOI_FICHE === 'validation' && passed);
  const fiche = envoyer ? buildFiche(n, pct, passed, duree) : { sujet: '', html: '' };
  postWebhook(Object.assign(basePayload(n, 'niveau terminé'), {
    niveau_valide: passed ? 'oui' : 'non',
    score: String(pct),
    seuil: String(SEUIL),
    tentative: String(state.levels[n].attempts),
    erreurs_tentative: errs.length ? errs.join(' ; ') : 'aucune',
    erreurs_frequentes: topErrors(n) || 'aucune',
    email: normEmail(state.player.email),
    duree_secondes: String(duree),
    avancement: 'terminé',
    envoyer_fiche: envoyer && state.player.email ? 'oui' : 'non',
    fiche_sujet: fiche.sujet,
    fiche_html: fiche.html,
    fiche_taille: String(fiche.html.length),
  }));
}

/* ---------- Fiche de score envoyée par e-mail (HTML compatible messageries) ---------- */
function buildFiche(n, pct, passed, duree) {
  const M = LEVEL_META[n], L = state.levels[n];
  const C = { or: '#EA6827', ord: '#C4501A', ink: '#333333', mut: '#666666', card: '#F3F3F3', peach: '#FDEEE3', ok: '#2C7A4B', oks: '#E3F2E8', bad: '#B3261E', bads: '#FBE5E3', line: '#E2E2E2' };
  const F = "font-family:Calibri,'Segoe UI',Arial,sans-serif;";
  const date = (() => { try { return new Date().toLocaleString('fr-FR', { dateStyle: 'long', timeStyle: 'short', timeZone: 'Europe/Paris' }); } catch (e) { return new Date().toISOString(); } })();
  const dureeTxt = duree === '' ? '' : `${Math.floor(duree / 60)} min ${String(duree % 60).padStart(2, '0')} s`;
  const sections = MODS[n] && MODS[n].details ? MODS[n].details() : [];
  const nbItems = sections.reduce((a, s) => a + s.items.length, 0);
  const nbOk = sections.reduce((a, s) => a + s.items.filter(i => i.ok).length, 0);
  const row = (k, v) => `<tr><td style="padding:3px 12px 3px 0;color:${C.mut};font-size:13px;white-space:nowrap">${k}</td><td style="padding:3px 0;font-size:14px;color:${C.ink}">${v}</td></tr>`;
  const item = it => `<tr>
    <td style="padding:10px 10px 10px 0;border-top:1px solid ${C.line};vertical-align:top;width:26px"><span style="display:inline-block;width:22px;height:22px;line-height:22px;border-radius:11px;text-align:center;color:#ffffff;font-weight:bold;font-size:13px;background:${it.ok ? C.ok : C.bad}">${it.ok ? '&#10003;' : '&#10007;'}</span></td>
    <td style="padding:10px 0;border-top:1px solid ${C.line};font-size:14px;line-height:1.5;color:${C.ink}">
      <b>${esc(it.label)}</b><br>
      ${it.given ? `<span style="color:${C.mut}">Votre réponse :</span> ${esc(it.given)}<br>` : ''}
      ${!it.ok && it.expected ? `<span style="color:${C.ok};font-weight:bold">Réponse attendue :</span> ${esc(it.expected)}<br>` : ''}
      ${it.why ? `<span style="color:${C.mut}">Explication :</span> ${esc(it.why)}` : ''}
    </td></tr>`;
  const parcours = [1, 2, 3, 4].filter(k => state.levels[k].attempts > 0).map(k =>
    `<tr><td style="padding:4px 12px 4px 0;font-size:14px;color:${C.ink}">Niveau ${k} · ${esc(LEVEL_META[k].title)}</td><td style="padding:4px 0;font-size:14px;font-weight:bold;color:${state.levels[k].passed ? C.ok : C.bad};text-align:right">${state.levels[k].best} %${state.levels[k].passed ? ' · validé' : ''}</td></tr>`).join('');
  const extra = typeof ficheExtra === 'function' ? ficheExtra(n, passed) : '';
  // Fragment HTML (sans <html>/<body>) : Make et Gmail l'insèrent tel quel dans le corps du message.
  const html = (`<div style="margin:0;padding:0;background:#ffffff">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#ffffff;${F}"><tr><td align="center" style="padding:24px 12px">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:640px;${F}">
  <tr><td style="padding:0 0 16px 0;border-bottom:3px solid ${C.or}">
    <span style="display:inline-block;width:34px;height:34px;line-height:34px;border-radius:17px;background:${C.or};color:#ffffff;font-weight:bold;text-align:center;font-size:14px">IA</span>
    <span style="font-size:16px;font-weight:bold;color:${C.ink};vertical-align:middle;padding-left:8px">Formation IA · Fiche de score</span>
  </td></tr>
  <tr><td style="padding:20px 0 6px 0">
    <p style="margin:0;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:${C.ord};font-weight:bold">Niveau ${n} sur 4 · ${esc(M.short)}</p>
    <p style="margin:4px 0 0 0;font-size:24px;color:${C.ink}">${esc(M.title)}</p>
  </td></tr>
  <tr><td style="padding:12px 0">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:${passed ? C.oks : C.bads};border-radius:6px"><tr>

</table></td></tr></table></div>`).replace(/>\s+</g, '><').replace(/\s{2,}/g, ' ');

}
function finishAttempt(n, pct, passed, errs) {
  const L = state.levels[n];
  delete L.inProgress;
  L.attempts += 1;
  L.best = Math.max(L.best, pct);
  errs.forEach(t => { L.errors[t] = (L.errors[t] || 0) + 1; });
  if (passed) L.passed = true;
  if (passed && isFinalLevel(n) && !state.completedAt) state.completedAt = new Date().toISOString();
  saveState();
  sendTracking(n, pct, passed, errs);
  if (passed) toast(`Niveau ${n} validé`, `Score ${pct} %. Votre résumé de cours est prêt.`);
  onProgress();
}

/* ---------- Console animée (niveaux 3 et 4) ---------- */
const LBL = { thought: 'Pensée', action: 'Action', obs: 'Observation', err: 'Échec', ok: 'OK', warn: 'Alerte', info: 'Info', final: 'Réponse finale' };
const lineHtml = e => `<div class="ln ln-${e.k}"><span class="lt">${LBL[e.k]}${e.it ? ` <span class="it">#${e.it}</span>` : ''}</span><span class="lx">${esc(e.t)}</span></div>`;
let playToken = 0;
function play(sess, events, onStep, onDone) {
  const token = ++playToken;
  sess.running = true; sess.log = [];
  render(false);
  const delay = reduceMotion() ? 0 : 520;
  let i = 0;
  const tick = () => {
    if (token !== playToken) return;
    if (i >= events.length) {
      sess.running = false; onDone(); render(false);
      const r = $('#result'); if (r) r.scrollIntoView({ behavior: reduceMotion() ? 'auto' : 'smooth', block: 'start' });
      return;
    }
    const e = events[i++]; sess.log.push(e); if (onStep) onStep(e);
    const c = $('#console');
    if (c) { if (sess.log.length === 1) c.innerHTML = ''; c.insertAdjacentHTML('beforeend', lineHtml(e)); c.scrollTop = c.scrollHeight; }
    if (delay === 0) tick(); else setTimeout(tick, delay);
  };
  tick();
}

const TF = {};
function tfReset(n) { TF[n] = { order: shuffle(TF_DATA[n].map((_, k) => k)), i: 0, picks: {}, streak: 0, best: 0, done: false, mainPct: null }; }
const tfGood = n => Object.entries(TF[n].picks).filter(([k, v]) => TF_DATA[n][k].v === v).length;
const tfPct = n => Math.round(tfGood(n) / TF_DATA[n].length * 100);
// Score final du niveau : 80 % défi principal, 20 % vrai ou faux.
function tfMix(n, mainPct) { TF[n].mainPct = mainPct; return Math.round(mainPct * (100 - TF_WEIGHT) / 100 + tfPct(n) * TF_WEIGHT / 100); }
const tfErrs = n => TF_DATA[n].filter((q, k) => TF[n].picks[k] !== q.v).map(q => q.tag);
function tfBreakdown(n) {
  const t = TF[n]; if (!t || t.mainPct === null) return '';
  return `<p class="small muted mt-3">Calcul : défi principal ${t.mainPct}/100 × ${100 - TF_WEIGHT} % + vrai ou faux ${tfGood(n)}/${TF_DATA[n].length} × ${TF_WEIGHT} %. Meilleure série : ${t.best}.</p>`;
}
function TFView(n) {
  const t = TF[n], D = TF_DATA[n];
  if (t.i >= D.length) {
    const g = tfGood(n);
    return `${LevelHeader(n)}<section class="panel tf-end" id="tf-stage">
      <p class="eyebrow">Échauffement terminé</p>
      <h2 class="h2 mt-2">${g} sur ${D.length} en vrai ou faux</h2>
      <p class="mt-2">Meilleure série : <b>${t.best}</b> bonne${t.best > 1 ? 's' : ''} réponse${t.best > 1 ? 's' : ''} d’affilée. Ce résultat compte pour ${TF_WEIGHT} % du score du niveau.</p>
      <div class="tf-recap mt-4">${t.order.map(k => `<span class="qdot ${t.picks[k] === D[k].v ? 'y' : 'n'}" title="${esc(D[k].tag)}"></span>`).join('')}</div>
      <div class="flex justify-end mt-6"><button class="btn btn-primary" data-action="tf-go">Passer au défi principal</button></div>
    </section>`;
  }
  const k = t.order[t.i], q = D[k], ans = t.picks[k], answered = ans !== undefined, ok = answered && ans === q.v;
  const dots = t.order.map((kk, p) => `<span class="qdot ${p < t.i || (p === t.i && answered) ? (t.picks[kk] === D[kk].v ? 'y' : 'n') : (p === t.i ? 'cur' : '')}"></span>`).join('');
  const btn = (val, label, key) => {
    let c = `tf-btn tf-${val ? 'true' : 'false'}`;
    if (answered) c += ans === val ? (ok ? ' ok' : ' bad') : (q.v === val ? ' ok-reveal' : ' fade');
    return `<button class="${c}" data-action="tf-pick" data-v="${val ? 1 : 0}" ${answered ? 'disabled' : ''}><b>${label}</b><small>touche ${key}</small></button>`;
  };
  return `${LevelHeader(n)}
  <section class="panel min-w-0" id="tf-stage">
    <div class="flex items-center justify-between gap-3 flex-wrap">
      <p class="eyebrow">Échauffement · Vrai ou faux éclair · ${t.i + 1} sur ${D.length}</p>
      <div class="flex items-center gap-3"><span class="pill tf-streak ${t.streak >= 3 ? 'hot' : ''}">Série : ${t.streak}</span><div class="qdots" aria-hidden="true">${dots}</div></div>
    </div>
    <div class="tf-card mt-4 ${answered ? (ok ? 'is-ok' : 'is-bad') : ''}"><p>${q.t}</p></div>
    <div class="tf-actions mt-4">${btn(true, 'Vrai', 'V')}${btn(false, 'Faux', 'F')}</div>
    ${answered ? `<div class="fb ${ok ? 'fb-ok' : 'fb-bad'} mt-5" role="status"><div class="fb-head">${ok ? '✓ Bien vu' : '✗ Raté'}${ok && t.streak >= 3 ? ` · série de ${t.streak} !` : ''}</div><p>${q.fb}</p></div>
      <div class="flex justify-end mt-5"><button class="btn btn-primary" data-action="tf-next">${t.i < D.length - 1 ? 'Affirmation suivante' : 'Voir mon échauffement'}</button></div>` : ''}
  </section>`;
}
function TFHandle(n, a, d) {
  const t = TF[n];
  if (a === 'tf-pick') {
    const k = t.order[t.i]; if (t.picks[k] !== undefined) return true;
    const v = d.v === '1'; t.picks[k] = v;
    if (v === TF_DATA[n][k].v) { t.streak++; t.best = Math.max(t.best, t.streak); } else t.streak = 0;
    render(false); return true;
  }
  if (a === 'tf-next') { t.i++; render(false); return true; }
  if (a === 'tf-go') { t.done = true; render(true); return true; }
  return false;
}
// Ajoute l'échauffement vrai/faux devant le défi principal d'un niveau.
function withTF(n) {
  const M = MODS[n], o = { start: M.start, view: M.view, handle: M.handle, progress: M.progress, details: M.details };
  M.start = function () { tfReset(n); return o.start.apply(M, arguments); };
  M.view = function () { return TF[n].done ? o.view.apply(M, arguments) : TFView(n); };
  M.handle = function (a, d, b) { return a.startsWith('tf-') ? TFHandle(n, a, d) : o.handle.call(M, a, d, b); };
  M.progress = function () {
    const nb = Object.keys(TF[n].picks).length;
    if (!TF[n].done) return { answered: nb, txt: `vrai ou faux : ${nb} affirmation${nb > 1 ? 's' : ''} sur ${TF_DATA[n].length}, dont ${tfGood(n)} juste${tfGood(n) > 1 ? 's' : ''}, défi principal non commencé` };
    const p = o.progress.call(M);
    return { answered: nb + (p.answered || 0), txt: `vrai ou faux ${tfGood(n)}/${TF_DATA[n].length} · ${p.txt}` };
  };
  M.details = function () {
    const D = TF_DATA[n];
    return [{ title: `Vrai ou faux (${TF_WEIGHT} % du score)`, items: D.map((q, k) => {
      const g = TF[n].picks[k], ok = g === q.v;
      return { label: q.t, ok, given: g === undefined ? 'sans réponse' : (g ? 'Vrai' : 'Faux'), expected: q.v ? 'Vrai' : 'Faux', why: q.fb };
    }) }, ...o.details.call(M)];
  };
}

let S1 = null;
MODS[1] = {
  progress() {
    const done = S1.picks.filter(p => p !== undefined).length;
    const ok = S1.picks.filter((p, k) => p !== undefined && L1Q[k].opts[p].ok).length;
    return { answered: done, txt: `${done} question${done > 1 ? 's' : ''} sur 10 répondue${done > 1 ? 's' : ''}, dont ${ok} juste${ok > 1 ? 's' : ''}` };

      const c = q.opts[S1.picks[k]], g = q.opts.find(o => o.ok);
      return { label: `${k + 1}. ${q.q} (${q.tag})`, ok: !!c.ok, given: c.t, expected: g.t, why: `${c.ok ? c.fb : g.fb} ${q.concept}` };
    }) }];
  },
  start() { S1 = { i: 0, picks: [], perm: L1Q.map(q => shuffle(q.opts.map((_, k) => k))), recorded: false }; },
  view() {
    const s = S1;
    if (s.i >= L1Q.length) return L1Result();
    const q = L1Q[s.i], p = s.picks[s.i], answered = p !== undefined;
    const dots = L1Q.map((qq, k) => {
      const c = k < s.i || (k === s.i && answered) ? (qq.opts[s.picks[k]].ok ? 'y' : 'n') : (k === s.i ? 'cur' : '');
      return `<span class="qdot ${c}"></span>`;
    }).join('');
    const opts = s.perm[s.i].map((k, pos) => {
      const o = q.opts[k]; let c = 'opt';
      if (answered) { if (k === p) c += o.ok ? ' ok' : ' bad'; else if (o.ok) c += ' ok-reveal'; else c += ' fade'; }
      return `<button class="${c}" data-action="l1-pick" data-k="${k}" ${answered ? 'disabled' : ''}><span class="key">${'ABCD'[pos]}</span><span class="opt-body">${o.t}</span></button>`;
    }).join('');
    const chosen = answered ? q.opts[p] : null;
    const good = q.opts.find(o => o.ok);
    const fb = answered ? `

    const score = s.picks.filter((pk, k) => L1Q[k].opts[pk].ok).length;
    return `${LevelHeader(1)}
    <div class="grid gap-6 lg:grid-cols-[minmax(0,1fr)_300px] items-start">

          ${q.who ? `<div class="mb-3">${person(q.who, 48)}</div>` : ''}
          <p>${q.scenario}</p>
        </div>
        <h2 class="h3 mt-5">${q.q}</h2>
        <div class="grid gap-2 mt-3">${opts}</div>
        ${fb}

      <aside class="card sticky-col min-w-0">
        <p class="eyebrow">Règle du niveau</p>
        <p class="mt-1 small">Dix situations, chaque réponse est expliquée. Score : situations 80 %, vrai ou faux 20 %. Il faut <b>${SEUIL}/100</b> pour valider.</p>
        <hr class="divider my-4">
        <p class="eyebrow grey">Bonnes réponses</p>
        <p class="num mt-1" style="font-size:30px;font-weight:700">${score}<span class="muted" style="font-size:18px"> / ${L1Q.length}</span></p>
        <hr class="divider my-4">
        <p class="eyebrow grey">Notions</p>

  handle(a, d) {
    if (a === 'l1-pick') { if (S1.picks[S1.i] === undefined) { S1.picks[S1.i] = +d.k; render(false); } return true; }

function L1Result() {
  const s = S1;
  const good = s.picks.filter((p, k) => L1Q[k].opts[p].ok).length;
  const pct = tfMix(1, Math.round(good / L1Q.length * 100)), passed = pct >= SEUIL;
  if (!s.recorded) { s.recorded = true; finishAttempt(1, pct, passed, [...tfErrs(1), ...L1Q.filter((q, k) => !q.opts[s.picks[k]].ok).map(q => q.tag)]); }
  const extra = `<p class="eyebrow grey">Détail de vos réponses</p>
    <div class="mt-2">${L1Q.map((q, k) => {
      const ok = q.opts[s.picks[k]].ok;
      return `<div class="review"><span class="mark ${ok ? 'y' : 'n'}">${ok ? '✓' : '✗'}</span><div class="min-w-0"><b>${q.tag}</b> <span class="muted">· ${q.mod}</span>${ok ? '' : `<p class="mt-1">${q.concept}</p>`}</div></div>`;
    }).join('')}</div>`;
  return `${LevelHeader(1)}${ResultCard({ n: 1, pct, passed,
    headline: passed ? `${good} sur 10 et ${tfGood(1)} sur 6 : vous savez ce que fait vraiment un LLM` : `${good} sur 10 et ${tfGood(1)} sur 6 : pas encore ${SEUIL}`,
    text: passed ? 'Tokens, probabilités, température, hallucinations, zones rouges : vous avez les bases pour conseiller un métier sans surpromettre.'
                 : 'Relisez les notions signalées en rouge, puis rejouez le niveau. Ces fondations conditionnent tous les niveaux suivants.',
    extra })}`;
}

const normName = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z]/g, '');
function hash4(src) {
  let h = 2166136261;
  for (const ch of src) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619) >>> 0; }
  const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let out = '';
  for (let i = 0; i < 4; i++) { out += A[h % 32]; h = Math.floor(h / 32); }

}
const unlockCode = (email, lvl) => `NIV${lvl}-${hash4(`${normEmail(email)}|${lvl}|${CODE_SECRET}`)}`;
const certCode = email => `CERT-${hash4(`${normEmail(email)}|certif|${CODE_SECRET}`)}`;
// Ajoute à la fiche e-mail le code du niveau suivant (ou le code de certificat).
function ficheExtra(n, passed) {
  if (!passed) return '';
  const code = n < 4 ? unlockCode(state.player.email, n + 1) : certCode(state.player.email);
  const label = n < 4 ? `Votre code pour ouvrir le niveau ${n + 1}` : 'Code de vérification de votre certificat « Concepteur IA certifié »';
  return `<tr><td style="padding:8px 0 4px 0"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#FDEEE3;border:2px dashed #EA6827;border-radius:8px"><tr><td style="padding:14px 18px;font-family:Calibri,'Segoe UI',Arial,sans-serif"><span style="font-size:13px;color:#666666">${label}</span><br><span style="font-family:Consolas,'Courier New',monospace;font-size:26px;font-weight:bold;letter-spacing:2px;color:#C4501A">${code}</span></td></tr></table></td></tr>`;
}
const cleanCode = s => String(s || '').toUpperCase().replace(/\s+/g, '');

function onProgress() {
  const L = state.levels[LEVEL];
  $('#gp-label').textContent = `Niveau ${LEVEL} sur 4 · ${L.passed ? 'validé' : 'en cours'}`;
  $('#gp-pct').textContent = `${L.best} %`;
  $('#gp').setAttribute('aria-valuenow', L.best);
  $('#gp-bar').innerHTML = [1, 2, 3, 4].map(n => {
    const w = n < LEVEL ? 100 : n === LEVEL ? (L.passed ? 100 : L.best) : 0;
    return `<span class="seg ${n < LEVEL || (n === LEVEL && L.passed) ? 'ok' : ''}" title="Niveau ${n}"><i style="width:${w}%"></i></span>`;
  }).join('');
  const ses = currentSession();
  $('#player').innerHTML = (state.player.prenom && state.gates[LEVEL] ? `<span class="muted">Joueur :</span> <b>${esc(playerName())}</b>` : '') + (ses ? ` <span class="pill">Session ${esc(ses)}</span>` : '');
}
function go(v) {
  playToken++;
  if (v === 'level' && state.gates[LEVEL]) {
    // Vérifie le groupe actif juste avant de lancer une partie.
    syncGroup().then(reset => route(reset ? 'gate' : 'level'));
    return;
  }
  route(v);
}
function route(v) {
  if (!state.gates[LEVEL]) v = 'gate';
  else if (v === 'summary' && !state.levels[LEVEL].passed) v = 'level';
  view = v;
  if (v === 'level') { MODS[LEVEL].start(); sendStart(LEVEL); }
  render(true);
}
function render(top) {
  const y = window.scrollY;
  if (view === 'gate') app.innerHTML = GateView();
  else if (view === 'summary') app.innerHTML = SummaryView();
  else app.innerHTML = MODS[LEVEL].view();
  onProgress(); updateChrono();
  if (top) { window.scrollTo(0, 0); const h = app.querySelector('h1'); if (h) h.focus({ preventScroll: true }); }
  else window.scrollTo(0, y);
}

function GateView() {
  const M = LEVEL_META[LEVEL];
  const needCode = LEVEL > 1;
  return `<section class="grid gap-8 lg:grid-cols-[minmax(0,1fr)_420px] items-start mt-10">
    <div class="min-w-0">
      <p class="eyebrow">Formation IA · Niveau ${LEVEL} sur 4 · ${M.short}</p>
      <h1 tabindex="-1" class="title mt-2">${M.title}</h1>
      <p class="lead mt-3">${M.intro}</p>
      <div class="flex flex-wrap gap-2 mt-4"><span class="pill">${M.format}</span><span class="pill pill-o">Validation : ${M.rule}</span><span class="pill">${M.src}</span></div>
      ${needCode ? `<div class="callout mt-6"><span class="eyebrow">Accès protégé</span><p>Ce niveau s’ouvre avec le code affiché à la fin du niveau ${LEVEL - 1}, dans le résumé de cours. Il vous a aussi été envoyé par e-mail. Le code est personnel : saisissez la même adresse e-mail qu’au niveau précédent.</p></div>`
                 : '<div class="banner mt-6">Chaque niveau exige 90 % de réussite. À la fin, votre résumé de cours affiche le code qui ouvre le niveau suivant.</div>'}
    </div>
    <div class="panel min-w-0" id="gate-form">
      <h2 class="h2">${needCode ? 'Déverrouiller le niveau' : 'Qui joue ?'}</h2>
      <p class="small muted mt-1">Votre nom et votre adresse figurent dans le suivi de la formation.</p>
      <div class="grid gap-4 mt-5">
        <div><label class="lbl" for="f-prenom">Prénom</label><input class="field" id="f-prenom" autocomplete="given-name" maxlength="40" value="${esc(state.player.prenom)}"></div>
        <div><label class="lbl" for="f-nom">Nom</label><input class="field" id="f-nom" autocomplete="family-name" maxlength="40" value="${esc(state.player.nom)}"></div>
        <div><label class="lbl" for="f-email">Adresse e-mail professionnelle</label><input class="field" id="f-email" type="email" autocomplete="email" maxlength="80" spellcheck="false" placeholder="prenom.nom@${esc(DOMAINE_EMAIL || 'entreprise.fr')}" value="${esc(state.player.email)}"><p class="xs muted mt-1">${ENVOI_FICHE === 'jamais' ? 'Elle identifie votre parcours.' : 'Votre fiche de score détaillée y sera envoyée.'}</p></div>
        ${needCode ? `<div><label class="lbl" for="f-code">Code du niveau ${LEVEL}</label><input class="field mono" id="f-code" placeholder="NIV${LEVEL}-XXXX" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="80"></div>` : ''}
        <p class="form-err" id="f-err" hidden></p>
        <button class="btn btn-primary" type="button" data-action="gate-submit">${needCode ? 'Déverrouiller' : 'Commencer le niveau 1'}</button>
      </div>
    </div>
  </section>`;
}
function SummaryView() {
  const em = state.player.email;
  let tail;
  if (LEVEL < 4) {
    const code = unlockCode(em, LEVEL + 1);
    tail = `<section class="panel mt-8">
      <div class="grid gap-6 md:grid-cols-[minmax(0,1fr)_minmax(0,1fr)] items-center">
        <div class="min-w-0">
          <p class="eyebrow">Accès au niveau ${LEVEL + 1}</p>
          <h2 class="h2 mt-1">${LEVEL_META[LEVEL + 1].title}</h2>
          <p class="mt-2">Ouvrez le fichier <b class="mono">niveau-${LEVEL + 1}.html</b>, puis saisissez vos prénom, nom, adresse e-mail et ce code. Il est personnel : il ne fonctionne qu’avec votre adresse.${ENVOI_FICHE === 'jamais' ? '' : ' Vous le retrouverez aussi dans l’e-mail de votre fiche de score.'}</p>
        </div>
        <div class="code-box"><p class="eyebrow grey">Votre code</p><p class="code-val mt-2" id="code-val">${code}</p>
          <button class="btn btn-ghost mt-3" data-action="copy-code" data-code="${code}">Copier le code</button></div>
      </div>
    </section>`;
  } else {
    const cc = certCode(em);
    const date = (() => { try { return new Date(state.completedAt || Date.now()).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' }); } catch (e) { return ''; } })();
    tail = `<section class="cert mt-8">
      <div class="relative flex flex-wrap items-start justify-between gap-6">
        <div class="min-w-0" style="flex:1 1 320px">
          <p class="eyebrow grey">Formation IA · Parcours terminé</p>
          <p class="mt-4 muted">Certifie que</p>
          <p class="mt-1" style="font-size:26px;font-weight:700">${esc(playerName())}</p>
          <p class="mt-3 muted">a validé les quatre niveaux et obtient le titre de</p>
          <p class="cert-title mt-1">Concepteur IA certifié</p>
          <p class="small muted mt-5">Délivré le ${date} · Code de vérification <span class="mono">${cc}</span></p>
        </div>
        <div class="seal"><div><b>${state.levels[4].best}</b><span>score niveau 4</span></div></div>
      </div>
      <div class="relative mt-8"><p class="eyebrow">Compétences acquises</p>
        <div class="mt-2">${[1, 2, 3, 4].map(k => `<div class="cert-skill"><span><b>Niveau ${k}</b> · ${LEVEL_META[k].title}</span><em>${k < 4 ? 'validé' : state.levels[4].best + ' %'}</em><small>${SKILLS[k]}</small></div>`).join('')}</div>
      </div>
      <div class="relative flex flex-wrap gap-3 mt-6"><button class="btn btn-primary" data-action="copy-cert">Copier mon résultat</button></div>
    </section>`;
  }
  return `<nav class="mt-6"><button class="link" data-action="back">← Revenir au niveau</button></nav>
    ${CourseSummary(LEVEL)}
    ${tail}
    <textarea id="share-fallback" class="field mt-4" readonly hidden aria-label="Texte à copier"></textarea>`;
}
function copyText(txt, okMsg) {
  const fallback = () => { const t = $('#share-fallback'); t.value = txt; t.hidden = false; t.focus(); t.select(); toast('Texte sélectionné', 'Copiez-le avec Ctrl+C ou ⌘+C.'); };
  try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(() => toast(okMsg, '')).catch(fallback); else fallback(); } catch (e) { fallback(); }
}

/* ---------- Réinitialisation (ce niveau uniquement) ---------- */
function openModal() { const o = $('#overlay'); o.hidden = false; o.style.display = ''; $('#m-cancel').focus(); }
function closeModal() { const o = $('#overlay'); o.hidden = true; o.style.display = 'none'; }

document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (!b || b.disabled) return;
  const a = b.dataset.action, d = b.dataset;
  if (view === 'level' && MODS[LEVEL].handle(a, d, b)) return;
  switch (a) {
    case 'retry': case 'back': go('level'); break;
    case 'summary': go('summary'); break;
    case 'gate-submit': submitGate(); break;
    case 'copy-code': copyText(d.code, 'Code copié'); break;
    case 'copy-cert': copyText(`Formation IA : ${playerName()}, Concepteur IA certifié. Score niveau 4 : ${state.levels[4].best} %. Code de vérification ${certCode(state.player.email)}.`, 'Résultat copié'); break;
    case 'ask-reset': openModal(); break;
    case 'cancel-reset': closeModal(); break;
    case 'confirm-reset': {
      if (state.levels[LEVEL].inProgress) sendAbandon(LEVEL, 'réinitialisation par l’apprenant');
      // Le compteur de tentatives et l'historique des erreurs sont conservés : une réinitialisation ne doit pas effacer les essais.
      { const old = state.levels[LEVEL]; state.levels[LEVEL] = Object.assign(lvState(), { attempts: old.attempts, errors: old.errors }); }
      delete state.gates[LEVEL];
      if (LEVEL === 4) state.completedAt = null;
      saveState(); closeModal(); toast('Niveau réinitialisé', LEVEL > 1 ? 'Saisissez à nouveau votre code pour rejouer.' : 'Saisissez à nouveau votre nom pour rejouer.'); go('gate'); break;
    }
  }
});
function submitGate() {
  const p = $('#f-prenom').value.trim(), n = $('#f-nom').value.trim(), em = normEmail($('#f-email').value);
  const err = $('#f-err');
  $('#f-prenom').classList.toggle('err', !p); $('#f-nom').classList.toggle('err', !n);
  if (!p || !n) { err.textContent = 'Renseignez votre prénom et votre nom.'; err.hidden = false; return; }
  const emErr = emailError(em);
  $('#f-email').classList.toggle('err', !!emErr);
  if (emErr) { err.textContent = emErr; err.hidden = false; return; }
  if (LEVEL > 1) {
    const typed = cleanCode($('#f-code').value);
    const ok = typed === cleanCode(unlockCode(em, LEVEL)) || typed === cleanCode(CODE_FORMATEUR);
    $('#f-code').classList.toggle('err', !ok);
    if (!ok) {
      // Code valide pour ce joueur, mais d'un autre niveau : refusé avec un message explicite.
      const other = [2, 3, 4].find(k => k !== LEVEL && typed === cleanCode(unlockCode(em, k)));
      if (!typed) err.textContent = `Saisissez le code affiché à la fin du niveau ${LEVEL - 1}.`;
      else if (other) err.textContent = `Ce code ouvre le niveau ${other}, pas le niveau ${LEVEL}. Le niveau ${LEVEL} s’ouvre uniquement avec le code obtenu en validant le niveau ${LEVEL - 1}.`;
      else err.textContent = `Code incorrect pour ${em}. Vérifiez le code reçu à la fin du niveau ${LEVEL - 1} et votre adresse e-mail.`;
      err.hidden = false; return;
    }
  }
  const changed = em !== normEmail(state.player.email);
  state.player = { prenom: p, nom: n, email: em };
  if (changed) { state.levels = { 1: lvState(), 2: lvState(), 3: lvState(), 4: lvState() }; state.gates = {}; state.completedAt = null; state.satisfaction = null; }
  state.gates[LEVEL] = true; saveState();
  go(state.levels[LEVEL].passed ? 'summary' : 'level');
}
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.closest && e.target.closest('#gate-form')) { e.preventDefault(); submitGate(); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#overlay').hidden) closeModal(); });
$('#overlay').addEventListener('click', e => { if (e.target.id === 'overlay') closeModal(); });

// Au retour sur l'onglet (poste partagé), vérifie si le formateur a changé de groupe.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || view === 'level') return;
  syncGroup().then(reset => { if (reset) route('gate'); });
});
app.innerHTML = loadingView();
syncGroup().then(() => route(state.gates[LEVEL] ? (state.levels[LEVEL].passed ? 'summary' : 'level') : 'gate'));

</script>
</body>
</html>
